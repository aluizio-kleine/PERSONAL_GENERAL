<title>Sobra do Mês</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  color-scheme: light;
  --plane:#f2efe8; --surface:#fbfaf6; --surface-2:#f5f2ea; --surface-3:#ece8dd;
  --ink:#14201d; --ink-2:#55605c; --muted:#8a938f;
  --line:#e2ddd2; --line-strong:#cec8ba;
  --accent:#0d6e5f; --accent-ink:#0d6e5f; --accent-soft:#e3efeb; --on-accent:#ffffff;
  --ord-1:#0d6e5f; --ord-2:#17a08a; --ord-3:#45b7a1;
  --good:#0ca30c; --good-ink:#006300;
  --warning:#fab219; --warning-ink:#8a5c00;
  --serious:#ec835a; --serious-ink:#a2431c;
  --critical:#d03b3b; --critical-ink:#b02b2b;
  --grid:#e6e2d8; --axis:#cec8ba;
  --shadow:0 1px 2px rgba(20,32,29,.05), 0 8px 24px -14px rgba(20,32,29,.28);
  --s-plano:#17a08a; --s-atual:#eb6834;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0d100f; --surface:#191c1b; --surface-2:#212523; --surface-3:#2a2f2d;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8b938f;
    --line:#2c302e; --line-strong:#3c423f;
    --accent:#35b89f; --accent-ink:#5ecfb8; --accent-soft:#162b27; --on-accent:#08211d;
    --ord-1:#7fd6c4; --ord-2:#35b89f; --ord-3:#14806e;
    --good:#0ca30c; --good-ink:#3ec93e;
    --warning:#fab219; --warning-ink:#fab219;
    --serious:#ec835a; --serious-ink:#ec835a;
    --critical:#d03b3b; --critical-ink:#f07070;
    --grid:#262b29; --axis:#383e3b;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
    --s-plano:#199e70; --s-atual:#d95926;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d100f; --surface:#191c1b; --surface-2:#212523; --surface-3:#2a2f2d;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8b938f;
  --line:#2c302e; --line-strong:#3c423f;
  --accent:#35b89f; --accent-ink:#5ecfb8; --accent-soft:#162b27; --on-accent:#08211d;
  --ord-1:#7fd6c4; --ord-2:#35b89f; --ord-3:#14806e;
  --good:#0ca30c; --good-ink:#3ec93e;
  --warning:#fab219; --warning-ink:#fab219;
  --serious:#ec835a; --serious-ink:#ec835a;
  --critical:#d03b3b; --critical-ink:#f07070;
  --grid:#262b29; --axis:#383e3b;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
  --s-plano:#199e70; --s-atual:#d95926;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.num{font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric:tabular-nums;}
h1,h2,h3{font-family:"Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif; text-wrap:balance; margin:0; letter-spacing:-.015em;}
h1{font-size:1.5rem; font-weight:700}
h2{font-size:1.18rem; font-weight:700}
h3{font-size:.95rem; font-weight:600}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
input,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

.eyebrow{
  font-size:.7rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted);
}

/* ---------- shell ---------- */
.wrap{max-width:1080px; margin:0 auto; padding:0 20px 80px}

.topbar{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--plane) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1080px; margin:0 auto; padding:14px 20px 0; display:flex; flex-direction:column; gap:12px}
.brand{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
.brand-id{display:flex; align-items:baseline; gap:10px}
.brand-id h1{font-size:1.2rem}
.brand-id .sub{font-size:.78rem; color:var(--muted)}
@media (max-width:640px){ .brand-id .sub{display:none} .brand-id h1{font-size:1.05rem} }

.monthnav{display:flex; align-items:center; gap:6px}
.monthnav button{
  width:30px; height:30px; display:grid; place-items:center;
  background:var(--surface); border:1px solid var(--line-strong); border-radius:8px;
  line-height:1;
}
.monthnav button:hover{background:var(--surface-2)}
.monthnav .label{
  min-width:132px; text-align:center; font-weight:600; font-size:.86rem;
}
.brand-tools{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.savebox{display:flex; align-items:center; gap:9px}
.saveflag{font-size:.72rem; color:var(--muted); white-space:nowrap}
.savebtn{
  display:flex; align-items:center; gap:7px;
  padding:6px 13px; border-radius:8px; font-size:.81rem; font-weight:600;
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-2);
}
.savebtn::before{content:""; width:7px; height:7px; border-radius:99px; background:var(--good); flex:none}
.savebtn[data-state="dirty"]{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.savebtn[data-state="dirty"]::before{background:var(--on-accent)}
.savebtn[data-state="dirty"]:hover{filter:brightness(1.08)}
.savebtn[data-state="saving"]{opacity:.65}
.savebtn[data-state="saving"]::before{background:var(--warning)}
.savebtn[data-state="local"]{border-color:color-mix(in srgb,var(--warning) 50%,transparent)}
.savebtn[data-state="local"]::before{background:var(--warning)}
.savebtn[data-state="clean"]{cursor:default}
.toast{
  position:fixed; left:50%; bottom:22px; transform:translate(-50%, 14px);
  background:var(--ink); color:var(--plane); padding:11px 18px; border-radius:10px;
  font-size:.85rem; font-weight:500; z-index:90; pointer-events:none;
  opacity:0; transition:opacity .18s, transform .18s; max-width:min(92vw,460px); text-align:center;
}
.toast.show{opacity:1; transform:translate(-50%, 0)}
.toast.bad{background:var(--critical); color:#fff}
.filebtn{position:relative; overflow:hidden; display:inline-flex}
.filebtn input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer; font-size:0}

.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  background:none; border:0; padding:9px 13px 11px; white-space:nowrap;
  font-size:.85rem; font-weight:500; color:var(--ink-2);
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--accent-ink); border-bottom-color:var(--accent); font-weight:600}

/* ---------- cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px; box-shadow:var(--shadow);
}
.card + .card{margin-top:16px}
.card-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap}
.card-head .hint{font-size:.78rem; color:var(--muted)}
[hidden]{display:none !important}
.stack{display:flex; flex-direction:column; gap:16px; padding-top:20px}

/* ---------- stat tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px}
.tile{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:14px 16px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:3px;
}
.tile .v{font-size:1.55rem; font-weight:600; letter-spacing:-.02em}
.tile .k{font-size:.72rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.tile .n{font-size:.76rem; color:var(--ink-2)}
.tile.hero{grid-column:span 2; border-color:var(--line-strong)}
.tile.hero .v{font-size:2.5rem}
@media (max-width:560px){ .tile.hero{grid-column:span 2} .tiles{grid-template-columns:1fr 1fr} }
.pos{color:var(--good-ink)} .neg{color:var(--critical-ink)}

.stripe{height:3px; border-radius:2px; width:34px; margin-bottom:4px}

/* ---------- structure bar ---------- */
.structure{display:flex; height:26px; border-radius:6px; overflow:hidden; gap:2px; background:transparent}
.structure span{display:block; height:100%}
.structure span:first-child{border-radius:6px 0 0 6px}
.structure span:last-child{border-radius:0 6px 6px 0}
.legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:12px}
.legend div{display:flex; align-items:center; gap:7px; font-size:.8rem; color:var(--ink-2)}
.legend i{width:11px; height:11px; border-radius:3px; flex:none}
.legend b{color:var(--ink); font-weight:600}

/* ---------- meters ---------- */
.meters{display:flex; flex-direction:column; gap:2px}
.meter{
  display:grid; grid-template-columns:1fr auto; gap:4px 12px;
  padding:11px 2px; border-bottom:1px solid var(--line);
}
.meter:last-child{border-bottom:0}
.meter .mname{font-weight:600; font-size:.92rem; display:flex; align-items:center; gap:7px}
.meter .mval{font-size:.86rem; text-align:right; white-space:nowrap}
.meter .mval em{font-style:normal; color:var(--muted)}
.meter .track{
  grid-column:1 / -1; display:block; height:9px; background:var(--surface-3);
  border-radius:5px; position:relative; overflow:hidden;
}
.meter .fill{display:block; height:100%; border-radius:5px 3px 3px 5px; min-width:4px}
.meter .note{grid-column:1 / -1; font-size:.76rem; color:var(--ink-2); display:flex; justify-content:space-between; gap:10px}
.chip-state{
  font-size:.66rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
  padding:2px 7px; border-radius:99px; border:1px solid;
}
.st-good{color:var(--good-ink); border-color:color-mix(in srgb,var(--good) 45%,transparent); background:color-mix(in srgb,var(--good) 10%,transparent)}
.st-warn{color:var(--warning-ink); border-color:color-mix(in srgb,var(--warning) 55%,transparent); background:color-mix(in srgb,var(--warning) 14%,transparent)}
.st-bad{color:var(--critical-ink); border-color:color-mix(in srgb,var(--critical) 45%,transparent); background:color-mix(in srgb,var(--critical) 10%,transparent)}
.st-livre{color:var(--ink-2); border-color:var(--line-strong); background:var(--surface-2)}

/* ---------- simulador ---------- */
.simrows{display:flex; flex-direction:column}
.simrow{
  display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:7px 12px;
  padding:15px 2px; border-bottom:1px solid var(--line); align-items:center;
}
.simrow > *{min-width:0}
.simrow:last-child{border-bottom:0}
.simrow .sname{font-weight:600; font-size:.94rem; display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0}
.simrow .sname input.plain{min-width:0}
.simrow .cmp{flex-wrap:wrap}
.simrow .snote{flex:1 1 100%; font-size:.77rem; color:var(--muted); font-weight:400; margin-top:1px}
.simrow .sctl{display:flex; align-items:center; gap:8px; white-space:nowrap}
.simrow .sctl span{font-size:.8rem; color:var(--muted)}
.simrow input[type=number]{width:104px; text-align:right; padding:7px 10px; font-family:"IBM Plex Mono",monospace; font-weight:600}
.simrow input[type=range]{
  grid-column:1 / -1; width:100%; height:24px; margin:0;
  accent-color:var(--accent); cursor:grab; background:transparent;
}
.simrow input[type=range]:active{cursor:grabbing}
.simrow .cmp{
  grid-column:1 / -1; display:flex; justify-content:space-between; gap:12px;
  font-size:.79rem; color:var(--ink-2); margin-top:-4px;
}
.simrow.livre{opacity:.92}
.capbar{display:flex; height:34px; border-radius:8px; overflow:hidden; gap:2px}
.capbar span{display:block; height:100%; min-width:0}
.capbar span:first-child{border-radius:8px 0 0 8px}
.capbar span:last-child{border-radius:0 8px 8px 0}
.caplabels{display:flex; flex-wrap:wrap; gap:14px; margin-top:11px}
.caplabels div{display:flex; align-items:center; gap:7px; font-size:.8rem; color:var(--ink-2)}
.caplabels i{width:11px; height:11px; border-radius:3px; flex:none}
.caplabels b{color:var(--ink); font-weight:600}
.simbanner{
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  padding:11px 15px; border-radius:10px; margin-bottom:16px; font-size:.86rem;
  background:var(--accent-soft); border:1px solid color-mix(in srgb,var(--accent) 38%,transparent);
}
.simbanner .acts{display:flex; gap:8px}
.row.simedit{gap:8px}
@media (max-width:640px){
  .row.simedit, .row-fix, .row-parc{
    display:flex !important; flex-wrap:wrap; align-items:center; gap:8px;
  }
  .row.simedit > span:first-child,
  .row.simedit > input[type=text]:first-child,
  .row-fix > input[type=text]:first-child,
  .row-fix > span:first-child,
  .row-parc > input[type=text]:first-child,
  .row-parc > span:first-child{flex:1 1 100%; min-width:0}
  .row.simedit input[type=number],
  .row-fix input[type=number],
  .row-parc input[type=number]{width:92px; flex:0 0 auto}
  .row.simedit input[type=month]{width:126px; flex:0 0 auto}
  .row.simedit > [data-fim]{flex:1 1 auto; text-align:left !important}
  .row.simedit > button, .row-fix > button, .row-parc > button{flex:0 0 auto; margin-left:auto}
  .simrow .sname input.plain{flex:1 1 100%}
  .simbanner .acts{width:100%}
  .simbanner .acts .btn{flex:1 1 0}
}
input.plain{
  border:1px solid transparent; background:none; padding:5px 7px; width:100%;
  border-radius:7px; font-weight:600;
}
input.plain:hover{border-color:var(--line)}
input.plain:focus{border-color:var(--accent); background:var(--surface-2)}
.simrow .sname{align-items:center}
.simrow .sname input.plain{flex:0 1 auto}
button.chip-state{cursor:pointer}
button.chip-state:hover{filter:brightness(.96)}
.cenarios{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px}
.cen{
  border:1px solid var(--line); border-radius:var(--r); padding:14px 15px;
  background:var(--surface-2); display:flex; flex-direction:column; gap:4px;
}
.cen .k{font-size:.72rem; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--muted)}
.cen .v{font-size:1.5rem; font-weight:600; letter-spacing:-.02em}
.cen .n{font-size:.77rem; color:var(--ink-2)}

/* ---------- forms ---------- */
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:.74rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
input[type=text],input[type=number],input[type=date],select{
  background:var(--surface-2); border:1px solid var(--line-strong); border-radius:9px;
  padding:9px 11px; width:100%; color:var(--ink);
}
input:focus,select:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft)}
.amount-in{
  font-family:"IBM Plex Mono", monospace; font-size:2rem !important; font-weight:600;
  padding:8px 14px !important; letter-spacing:-.02em;
}
.btn{
  background:var(--accent); color:var(--on-accent); border:1px solid transparent;
  padding:10px 18px; border-radius:9px; font-weight:600; font-size:.9rem;
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface-2); color:var(--ink); border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--surface-3); filter:none}
.btn.sm{padding:6px 12px; font-size:.8rem; border-radius:8px}
.btn.danger{background:none; border-color:transparent; color:var(--muted); padding:4px 8px; font-size:.9rem}
.btn.danger:hover{color:var(--critical-ink); background:color-mix(in srgb,var(--critical) 10%,transparent); filter:none}

.catchips{display:flex; flex-wrap:wrap; gap:8px}
.catchips button{
  background:var(--surface-2); border:1px solid var(--line-strong); border-radius:99px;
  padding:8px 15px; font-size:.87rem; font-weight:500;
}
.catchips button:hover{background:var(--surface-3)}
.catchips button[aria-pressed="true"]{
  background:var(--accent); color:var(--on-accent); border-color:var(--accent);
}
.quickvals{display:flex; flex-wrap:wrap; gap:6px}
.quickvals button{
  background:none; border:1px dashed var(--line-strong); border-radius:8px;
  padding:5px 10px; font-size:.78rem; color:var(--ink-2);
  font-family:"IBM Plex Mono", monospace;
}
.quickvals button:hover{border-style:solid; color:var(--ink)}

.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px}

/* ---------- tables / rows ---------- */
.rows{display:flex; flex-direction:column}
.row{
  display:grid; align-items:center; gap:10px;
  padding:9px 2px; border-bottom:1px solid var(--line);
}
.row:last-of-type{border-bottom:0}
.row-fix{grid-template-columns:1fr 116px 34px}
.row-parc{grid-template-columns:1fr 110px 96px 34px}
.row-lanc{grid-template-columns:auto 1fr auto auto}
.row-merc{grid-template-columns:22px minmax(0,1fr) 70px 64px 92px 96px 34px; gap:8px}
.row-merc input[type=checkbox]{width:18px; height:18px; accent-color:var(--accent); margin:0}
.row-merc .un{text-align:center}
.row-merc .sub{font-weight:600}
.row-merc.ok .nm, .row-merc.ok .sub{text-decoration:line-through; color:var(--muted)}
.row-merc-head{font-size:.7rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding-bottom:4px}
@media (max-width:640px){
  .row-merc{display:flex !important; flex-wrap:wrap; align-items:center}
  .row-merc.row-merc-head{display:none !important}
  .row-merc > .nm{flex:1 1 calc(100% - 80px); min-width:0}
  .row-merc > button{order:1}
  .row-merc > input.money, .row-merc > .un, .row-merc > .sub{order:2}
  .row-merc > input.money{width:76px; flex:0 0 auto}
  .row-merc > .un{width:56px; flex:0 0 auto}
  .row-merc > .sub{flex:1 1 auto; text-align:right}
  .tile.wide-sm{grid-column:1 / -1}
}
.row-lanc .acoes{display:flex; gap:0}
.row-lanc-edit{grid-template-columns:104px 1fr 58px 1.2fr auto auto; gap:8px; align-items:center}
.row-lanc-edit input, .row-lanc-edit select{padding:6px 9px; font-size:.86rem}
.row-lanc-edit select{background:var(--surface-2); border:1px solid var(--line-strong); border-radius:9px; width:100%}
@media (max-width:640px){
  .row-lanc-edit{display:flex !important; flex-wrap:wrap; gap:8px}
  .row-lanc-edit > [data-n]{flex:1 1 100%; order:5}
  .row-lanc-edit > select{flex:1 1 130px}
  .row-lanc-edit > input[data-v]{width:96px}
  .row-lanc-edit > input[data-d]{width:58px}
  .row-lanc-edit > button{flex:1 1 0; order:6}
}
.row .nm{font-weight:500; font-size:.9rem; overflow:hidden; text-overflow:ellipsis}
.row input{padding:6px 9px; font-size:.86rem}
.row .money{text-align:right}
.datechip{
  font-size:.72rem; color:var(--muted); background:var(--surface-2);
  border:1px solid var(--line); border-radius:6px; padding:2px 7px; white-space:nowrap;
}
.totrow{
  display:flex; justify-content:space-between; align-items:baseline;
  padding-top:12px; margin-top:6px; border-top:2px solid var(--line-strong);
  font-weight:600;
}
.dots{display:flex; gap:3px; align-items:center}
.dots i{width:6px; height:6px; border-radius:99px; background:var(--surface-3); flex:none}
.dots i.on{background:var(--ord-2)}
.dots i.now{background:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}

.empty{color:var(--muted); font-size:.86rem; padding:18px 0; text-align:center}

/* ---------- chart ---------- */
.chartbox{position:relative; overflow-x:auto}
.chartbox svg{display:block; width:100%; min-width:660px; height:auto}
.tip{
  position:absolute; pointer-events:none; opacity:0; transition:opacity .1s;
  background:var(--ink); color:var(--plane); border-radius:8px; padding:8px 11px;
  font-size:.78rem; line-height:1.45; white-space:nowrap; z-index:5;
  box-shadow:0 6px 20px -8px rgba(0,0,0,.5);
}
.tip b{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.bar{transition:opacity .12s}
.chartbox:hover .bar{opacity:.55}
.chartbox .bar:hover, .chartbox .bar.hot{opacity:1}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

table.data{width:100%; border-collapse:collapse; font-size:.84rem; margin-top:14px}
table.data th,table.data td{padding:6px 10px; text-align:right; border-bottom:1px solid var(--line)}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600}

/* ---------- plan ---------- */
.levers{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px}
.lever{
  border:1px solid var(--line); border-radius:var(--r); padding:14px 15px;
  background:var(--surface-2); display:flex; flex-direction:column; gap:5px;
}
.lever .v{font-size:1.4rem; font-weight:600; letter-spacing:-.02em}
.lever .k{font-size:.8rem; font-weight:600}
.lever .n{font-size:.76rem; color:var(--ink-2)}
.lever.win{background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 40%,transparent)}

.apgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(135px,1fr)); gap:10px 14px; margin-bottom:4px}
.apgrid label{font-size:.72rem; color:var(--muted); display:flex; flex-direction:column; gap:4px}
.apgrid input{width:100%; box-sizing:border-box}
table.data tr.tot td{font-weight:600; color:var(--ink); border-top:1px solid var(--line-strong)}

ol.actions{margin:0; padding:0; list-style:none; counter-reset:a; display:flex; flex-direction:column; gap:0}
ol.actions li{
  counter-increment:a; display:grid; grid-template-columns:26px 1fr auto; gap:12px;
  padding:13px 0; border-bottom:1px solid var(--line); align-items:start;
}
ol.actions li:last-child{border-bottom:0}
ol.actions li::before{
  content:counter(a); font-family:"IBM Plex Mono",monospace; font-size:.76rem; font-weight:600;
  color:var(--accent-ink); background:var(--accent-soft); border-radius:6px;
  width:24px; height:24px; display:grid; place-items:center; margin-top:1px;
}
ol.actions .t{font-weight:600; font-size:.92rem}
ol.actions .d{font-size:.83rem; color:var(--ink-2); margin-top:2px}
ol.actions .amt{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:.9rem; white-space:nowrap}

.callout{
  border-left:3px solid var(--accent); background:var(--accent-soft);
  padding:13px 16px; border-radius:0 10px 10px 0; font-size:.89rem; color:var(--ink);
}
.callout strong{font-weight:600}
.prose{font-size:.89rem; color:var(--ink-2); line-height:1.6}
.prose strong{color:var(--ink); font-weight:600}
.steps{display:flex; flex-direction:column; gap:0}
.step{display:grid; grid-template-columns:96px 1fr; gap:14px; padding:11px 0; border-bottom:1px solid var(--line); align-items:start}
.step:last-child{border-bottom:0}
.step .when{font-size:.78rem; font-weight:600; color:var(--accent-ink); text-transform:capitalize; padding-top:1px}
.step .what{font-size:.87rem}
.step .what b{font-weight:600}
.step .sub{display:block; font-size:.79rem; color:var(--muted); margin-top:3px}
</style>

/* campo de dinheiro: text + teclado decimal, porque type=number rejeita virgula */
const inVal = (v, extra) =>
  `<input type="text" inputmode="decimal" class="num money" value="${fmtIn(v)}"${extra||""}>`;

/* ============ model ============ */
const fixoVale = (f, mes) => f.ativo !== false
  && (!f.de  || mi(mes) >= mi(f.de))
  && (!f.ate || mi(mes) <= mi(f.ate));
const fixosTotal = (mes) => S.fixos.filter(f=>fixoVale(f, mes||S.mesAtual)).reduce((a,f)=>a+(+f.valor||0),0);
const parcelaAtiva = (p, mes) => { const d = mi(mes)-mi(p.mesRef); return d>=0 && d <= (p.total - p.num); };
const parcelasNo   = mes => S.parcelas.filter(p=>parcelaAtiva(p,mes));
const parcelasTotal= mes => parcelasNo(mes).reduce((a,p)=>a+(+p.valor||0),0);
const parcelaFim   = p => mk(mi(p.mesRef) + (p.total - p.num));
const lancsDo      = mes => S.lancamentos.filter(l=>l.mes===mes);
const filhosDe     = id => S.subcats.filter(x=>x.pai===id).map(x=>x.id);
const gastoCat     = (mes,cat) => { const k=filhosDe(cat);
  return lancsDo(mes).filter(l=>l.cat===cat||k.indexOf(l.cat)>=0).reduce((a,l)=>a+(+l.valor||0),0); };
const variavelTotal= mes => lancsDo(mes).reduce((a,l)=>a+(+l.valor||0),0);
const metasTotal   = () => S.categorias.reduce((a,c)=>a+(+c.meta||0),0);
const baseTotal    = () => S.categorias.reduce((a,c)=>a+(+c.base||0),0);
const catsLanc     = () => S.categorias.reduce((a,c)=>a.concat([c], S.subcats.filter(x=>x.pai===c.id)), []);
const nomeCat      = id => (S.categorias.find(c=>c.id===id)||S.subcats.find(c=>c.id===id)||{nome:id}).nome;
/* roda fn com S apontando para outro estado — usado pelo simulador */
function withState(st, fn){ const old = S; S = st; try{ return fn(); } finally { S = old; } }

function liquidoEm(mes){
  const d = S.renda.degraus.slice().sort((a,b)=>mi(a.mes)-mi(b.mes));
  let v = d.length ? d[0].liquido : 0;
  for(const x of d){ if(mi(x.mes) <= mi(mes)) v = +x.liquido||0; }
  return v;
}
function brutoEm(mes){
  const d = S.renda.degraus.slice().sort((a,b)=>mi(a.mes)-mi(b.mes));
  let v = d.length ? d[0].bruto : 0;
  for(const x of d){ if(mi(x.mes) <= mi(mes)) v = +x.bruto||0; }
  return v;
}
function resumo(mes){
  const liq=liquidoEm(mes), fx=fixosTotal(mes), pc=parcelasTotal(mes), vr=variavelTotal(mes);
  return {liq, fx, pc, vr, saiu:fx+pc+vr, sobra:liq-(fx+pc+vr)};
}
/* entradas fora do salário (13º, PPR, férias); "anual" repete a cada 12 meses */
const extrasNo = mes => (S.extras||[]).filter(x => x.mes && mi(mes) >= mi(x.mes)
  && (x.anual ? (mi(mes)-mi(x.mes)) % 12 === 0 : mes === x.mes));
/* meta de quitação: ao juntar "alvo", paga "paga" e o fixo indicado deixa de sair no mês seguinte */
const metaAtiva = () => (S.meta && S.meta.ativo !== false && +S.meta.alvo > 0) ? S.meta : null;
function projecao(nMeses){
  const ref = S.investidoRef || S.mesAtual;
  const start = mi(ref), meta = metasTotal(), base = baseTotal(), r = (+S.rendimento||0)/100;
  const M = metaAtiva(), fixoM = M ? S.fixos.find(f=>f.id===M.fixoId) : null;
  const cripto = +S.cripto || 0;                    /* conta no patrimônio pelo valor de hoje, sem rendimento */
  let accP = (+S.investido || 0) + cripto, accA = accP, jurosP = 0, qP = null, qA = null;
  const out=[];
  for(let i=0;i<nMeses;i++){
    const mes = mk(start+i), liq = liquidoEm(mes), pc = parcelasTotal(mes), fx0 = fixosTotal(mes);
    const corte = fixoM && fixoVale(fixoM, mes) ? (+fixoM.valor||0) : 0;
    const fx = fx0 - (qP ? corte : 0), fxA = fx0 - (qA ? corte : 0);
    const real = i === 0 ? variavelTotal(mes) : 0;            /* mês do saldo: o que já foi gasto conta */
    const ex = i === 0 ? [] : extrasNo(mes), extra = ex.reduce((a,x)=>a+(+x.valor||0),0);
    const plano = liq-fx-pc-Math.max(meta, real), atual = liq-fxA-pc-Math.max(base, real);
    const jp = (accP-cripto)*r, ja = (accA-cripto)*r;
    jurosP += jp;
    accP += jp + plano + extra; accA += ja + atual + extra;
    const o = { mes, liq, pc, fx, plano, atual, extra, ex, jp, jurosP, accP, accA, preP:null, preA:null, quitaP:false, quitaA:false };
    if(M && !qP && accP >= M.alvo){ o.preP = accP; accP -= M.paga; o.accP = accP; o.quitaP = true; qP = mes; }
    if(M && !qA && accA >= M.alvo){ o.preA = accA; accA -= M.paga; o.accA = accA; o.quitaA = true; qA = mes; }
    out.push(o);
  }
  out.qP = qP; out.qA = qA; out.start = ref;
  return out;
}
function statusPct(p){ return p<=0.85 ? "good" : (p<=1 ? "warn" : "bad"); }
const STC = {good:"var(--good)", warn:"var(--warning)", bad:"var(--critical)"};
const STL = {good:"no ritmo", warn:"no limite", bad:"estourou"};

/* ============ render: PAINEL ============ */
let verTudo = false, editando = null;

function linhaEdicao(l){
  const row = el(`
    <div class="row row-lanc-edit">
      <input data-v type="text" inputmode="decimal" class="num money" value="${fmtIn(l.valor)}" aria-label="Valor">
      <select data-c aria-label="Categoria">
        ${catsLanc().map(c=>`<option value="${esc(c.id)}"${c.id===l.cat?" selected":""}>${esc(c.nome)}</option>`).join("")}
      </select>
      <input data-d type="number" min="1" max="31" class="num" value="${l.dia||""}" placeholder="dia" aria-label="Dia">
      <input data-n type="text" value="${esc(l.nota||"")}" placeholder="descrição" aria-label="Descrição">
      <button class="btn sm" data-ok>Salvar</button>
      <button class="btn ghost sm" data-no>Cancelar</button>
    </div>`);
  const salvar = () => {
    const v = parseVal(row.querySelector("[data-v]").value);
    if(!v || v<=0){ toast("O valor precisa ser maior que zero.", true); row.querySelector("[data-v]").focus(); return; }
    l.valor = v;
    l.cat   = row.querySelector("[data-c]").value;
    l.dia   = +row.querySelector("[data-d]").value || null;
    l.nota  = row.querySelector("[data-n]").value.trim();
    editando = null; commit();
    toast("Lançamento atualizado.");
  };
  row.querySelector("[data-ok]").onclick = salvar;
  row.querySelector("[data-no]").onclick = () => { editando = null; renderPainel(); };
  row.querySelectorAll("input").forEach(i => i.onkeydown = e => {
    if(e.key === "Enter") salvar();
    if(e.key === "Escape"){ editando = null; renderPainel(); }
  });
  setTimeout(()=>{ const f=row.querySelector("[data-v]"); if(f){ f.focus(); f.select(); } }, 0);
  return row;
}
function renderPainel(){
  const mes = S.mesAtual, r = resumo(mes);
  const root = document.getElementById("tab-painel");
  root.innerHTML = "";

  const sobraCls = r.sobra >= 0 ? "pos" : "neg";
  root.appendChild(el(`
    <div class="tiles">
      <div class="tile hero">
        <div class="stripe" style="background:${r.sobra>=0?"var(--good)":"var(--critical)"}"></div>
        <span class="k">Sobra do mês</span>
        <span class="v num ${sobraCls}">${signed(r.sobra)}</span>
        <span class="n">${r.sobra>=0 ? "está sobrando dinheiro este mês" : "você está gastando mais do que ganha"}</span>
      </div>
      <div class="tile">
        <span class="k">Entrou</span>
        <span class="v num">${money(r.liq)}</span>
        <span class="n">líquido · bruto ${money(brutoEm(mes))}</span>
      </div>
      <div class="tile">
        <span class="k">Saiu</span>
        <span class="v num">${money(r.saiu)}</span>
        <span class="n">${r.liq? Math.round(r.saiu/r.liq*100):0}% do que entrou</span>
      </div>
    </div>`));

  /* structure */
  const denom = Math.max(r.liq, r.saiu) || 1;
  const seg = (v,c) => `<span style="background:${c}; width:${(v/denom*100).toFixed(2)}%"></span>`;
  const restante = Math.max(0, r.liq - r.saiu);
  const estouro  = Math.max(0, r.saiu - r.liq);
  root.appendChild(el(`
    <div class="card">
      <div class="card-head">
        <h2>Para onde vai o salário</h2>
        <span class="hint">do mais rígido ao mais flexível</span>
      </div>
      <div class="structure">
        ${seg(r.fx,"var(--ord-1)")}${seg(r.pc,"var(--ord-2)")}${seg(r.vr,"var(--ord-3)")}
        ${restante>0 ? seg(restante,"var(--surface-3)") : ""}
        ${estouro>0  ? seg(estouro,"var(--critical)") : ""}
      </div>
      <div class="legend">
        <div><i style="background:var(--ord-1)"></i>Fixos <b class="num">${money(r.fx)}</b> <span class="num">(${Math.round(r.fx/denom*100)}%)</span></div>
        <div><i style="background:var(--ord-2)"></i>Parcelas <b class="num">${money(r.pc)}</b> <span class="num">(${Math.round(r.pc/denom*100)}%)</span></div>
        <div><i style="background:var(--ord-3)"></i>Variáveis <b class="num">${money(r.vr)}</b> <span class="num">(${Math.round(r.vr/denom*100)}%)</span></div>
        ${restante>0?`<div><i style="background:var(--surface-3)"></i>Sobra <b class="num">${money(restante)}</b></div>`:""}
        ${estouro>0?`<div><i style="background:var(--critical)"></i>Estouro <b class="num">${money(estouro)}</b></div>`:""}
      </div>
    </div>`));

  /* envelopes */
  const cats = S.categorias.map(c => {
    const g = gastoCat(mes,c.id), meta = +c.meta||0;
    return {c, g, meta, livre: c.tipo==="livre", pct: meta ? g/meta : (g?2:0)};
  }).sort((a,b)=>(a.livre-b.livre) || (b.pct-a.pct));
  const gastoV = cats.reduce((a,x)=>a+x.g,0);
  const comTeto  = cats.filter(x=>!x.livre);
  const gastoT   = comTeto.reduce((a,x)=>a+x.g,0);
  const metaT    = comTeto.reduce((a,x)=>a+x.meta,0);

  const envCard = el(`
    <div class="card">
      <div class="card-head">
        <h2>Envelopes do mês</h2>
        <span class="hint num">${money(gastoT)} de ${money(metaT)} nos tetos</span>
      </div>
      <div class="meters"></div>
      <div class="totrow"><span>Com teto</span><span class="num ${gastoT>metaT?"neg":"pos"}">${money(gastoT)} / ${money(metaT)}</span></div>
      <div class="totrow" style="border-top:1px solid var(--line); font-weight:500; color:var(--ink-2)"><span>Total variável (com farmácia)</span><span class="num">${money(gastoV)}</span></div>
    </div>`);
  const mBox = envCard.querySelector(".meters");
  cats.forEach(({c,g,meta,pct,livre}) => {
    if(livre){
      mBox.appendChild(el(`
        <div class="meter">
          <span class="mname">${esc(c.nome)} <span class="chip-state st-livre">sem teto</span></span>
          <span class="mval num">${money(g)}</span>
          <span class="note"><span>${esc(c.nota||"")}</span><span class="num">previsão ${money(meta)}</span></span>
        </div>`));
      return;
    }
    const st = statusPct(pct), rest = meta-g;
    const kids = filhosDe(c.id);
    const detalhe = kids.length ? kids.map(k => {
      const kg = lancsDo(mes).filter(l=>l.cat===k).reduce((a,l)=>a+(+l.valor||0),0);
      return `${esc(nomeCat(k))} <b class="num">${money(kg)}</b>`;
    }).concat([`resto <b class="num">${money(g - kids.reduce((a,k)=>a+lancsDo(mes).filter(l=>l.cat===k).reduce((x,l)=>x+(+l.valor||0),0),0))}</b>`]).join(" · ") : "";
    mBox.appendChild(el(`
      <div class="meter">
        <span class="mname">${esc(c.nome)} <span class="chip-state st-${st==="good"?"good":st==="warn"?"warn":"bad"}">${STL[st]}</span></span>
        <span class="mval num">${money(g)} <em>/ ${money(meta)}</em></span>
        <span class="track"><span class="fill" style="width:${Math.min(100,pct*100).toFixed(1)}%; background:${STC[st]}"></span></span>
        <span class="note">
          <span>${rest>=0 ? "faltam "+money(rest)+" até o teto" : money(-rest)+" acima do teto"}</span>
          <span class="num">${Math.round(pct*100)}%</span>
        </span>
        ${detalhe ? `<span class="note" style="color:var(--muted)"><span>dentro disso: ${detalhe}</span><span></span></span>` : ""}
      </div>`));
  });
  root.appendChild(envCard);

  /* recent */
  const ls = lancsDo(mes).slice().sort((a,b)=>(b.dia||0)-(a.dia||0));
  const CAP = 8, shown = verTudo ? ls : ls.slice(0, CAP);
  const lc = el(`
    <div class="card">
      <div class="card-head"><h2>Lançamentos de ${esc(mLabel(mes))}</h2><span class="hint num">${ls.length} registro${ls.length===1?"":"s"} · ${money(variavelTotal(mes))}</span></div>
      <div class="rows"></div>
      ${ls.length > CAP ? `<div style="margin-top:14px"><button class="btn ghost sm" id="verTudo">${verTudo ? "mostrar menos" : "ver todos os "+ls.length}</button></div>` : ""}
    </div>`);
  const lb = lc.querySelector(".rows");
  if(!ls.length) lb.appendChild(el(`<p class="empty">Nada lançado ainda. Vá em <b>Lançar</b> para começar.</p>`));
  shown.forEach(l => {
    if(editando === l.id){ lb.appendChild(linhaEdicao(l)); return; }
    const row = el(`
      <div class="row row-lanc">
        <span class="datechip num">${l.dia ? String(l.dia).padStart(2,"0")+"/"+mShort(l.mes).split("/")[0] : "fatura"}</span>
        <span class="nm">${esc(nomeCat(l.cat))}${l.nota && l.nota!=="planilha" ? ' <span style="color:var(--muted);font-weight:400">· '+esc(l.nota)+'</span>' : ""}</span>
        <span class="num money">${BRL2.format(l.valor)}</span>
        <span class="acoes">
          <button class="btn danger" data-ed title="Editar" aria-label="Editar lançamento">✎</button>
          <button class="btn danger" data-del title="Apagar" aria-label="Apagar lançamento">×</button>
        </span>
      </div>`);
    row.querySelector("[data-ed]").onclick  = () => { editando = l.id; renderPainel(); };
    row.querySelector("[data-del]").onclick = () => { S.lancamentos = S.lancamentos.filter(x=>x.id!==l.id); commit(); };
    lb.appendChild(row);
  });
  const vt = lc.querySelector("#verTudo");
  if(vt) vt.onclick = () => { verTudo = !verTudo; renderPainel(); };
  root.appendChild(lc);
}

/* ============ render: LANÇAR ============ */
let draft = {cat:null, valor:"", dia:null, nota:""};
function renderLancar(){
  const root = document.getElementById("tab-lancar");
  root.innerHTML = "";
  const mes = S.mesAtual;
  const lista = catsLanc();
  if(!draft.cat || !lista.some(c => c.id === draft.cat)) draft.cat = lista[0].id;
  const today = new Date();
  const defDia = draft.dia != null ? draft.dia
    : (mk(mi(mes)) === (today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")) ? today.getDate() : 1);

  const card = el(`
    <div class="card">
      <div class="card-head"><h2>Novo gasto</h2><span class="hint">entra em ${esc(mLabel(mes))}</span></div>
      <div style="display:flex; flex-direction:column; gap:16px">
        <div class="field">
          <label for="vIn">Valor</label>
          <input id="vIn" class="amount-in num" type="text" inputmode="decimal" placeholder="0,00" value="${esc(draft.valor)}">
          <div class="quickvals">
            ${[20,43,50,80,120,200].map(v=>`<button type="button" data-v="${v}">+${v}</button>`).join("")}
            <button type="button" data-clear="1">limpar</button>
          </div>
        </div>
        <div class="field">
          <label>Categoria</label>
          <div class="catchips">
            ${catsLanc().map(c=>`<button type="button" data-cat="${esc(c.id)}" aria-pressed="${c.id===draft.cat}">${esc(c.nome)}</button>`).join("")}
          </div>
        </div>
        <div class="grid2">
          <div class="field"><label for="dIn">Dia</label><input id="dIn" class="num" type="number" min="1" max="31" value="${defDia}"></div>
          <div class="field"><label for="nIn">Nota (opcional)</label><input id="nIn" type="text" placeholder="ex: feira, uber, remédio" value="${esc(draft.nota)}"></div>
        </div>
        <div><button class="btn" id="addBtn">Adicionar gasto</button></div>
      </div>
    </div>`);

  const vIn = card.querySelector("#vIn");
  card.querySelectorAll(".quickvals button").forEach(b => b.onclick = () => {
    if(b.dataset.clear){ vIn.value=""; }
    else vIn.value = fmtIn(parseVal(vIn.value) + (+b.dataset.v));
    vIn.focus();
  });
  card.querySelectorAll(".catchips button").forEach(b => b.onclick = () => {
    draft.cat = b.dataset.cat;
    card.querySelectorAll(".catchips button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.cat===draft.cat)));
  });
  const submit = () => {
    const v = parseVal(vIn.value);
    if(!v || v<=0){ vIn.focus(); return; }
    S.lancamentos.push({ id:uid(), mes, dia:+card.querySelector("#dIn").value||null, cat:draft.cat, valor:v, nota:card.querySelector("#nIn").value.trim() });
    draft = {cat:draft.cat, valor:"", dia:+card.querySelector("#dIn").value||null, nota:""};
    commit();
    setTimeout(()=>{ const f=document.querySelector("#vIn"); if(f) f.focus(); },0);
  };
  card.querySelector("#addBtn").onclick = submit;
  vIn.onkeydown = e => { if(e.key==="Enter") submit(); };
  root.appendChild(card);

  const resumoCats = el(`
    <div class="card">
      <div class="card-head"><h2>Como está o mês</h2><span class="hint">os tetos se ajustam no <b>Simulador</b></span></div>
      <div class="rows"></div>
    </div>`);
  const rb = resumoCats.querySelector(".rows");
  catsLanc().forEach(c => {
    const pai = S.subcats.find(x=>x.id===c.id);
    const g = gastoCat(mes,c.id);
    const teto = pai ? null : (c.tipo==="livre" ? null : +c.meta||0);
    rb.appendChild(el(`
      <div class="row" style="grid-template-columns:1fr auto">
        <span class="nm">${pai?"↳ ":""}${esc(c.nome)}${pai?` <span style="color:var(--muted);font-weight:400;font-size:.78rem">dentro de ${esc(nomeCat(pai.pai))}</span>`:""}</span>
        <span class="num" style="color:${teto!=null && g>teto ? "var(--critical-ink)" : "var(--ink)"}">${money(g)}${teto!=null?` <span style="color:var(--muted)">/ ${money(teto)}</span>`:` <span style="color:var(--muted)">sem teto</span>`}</span>
      </div>`));
  });
  root.appendChild(resumoCats);
}

/* ============ render: MERCADO ============ */
function renderMercado(){
  const root = document.getElementById("tab-mercado");
  root.innerHTML = "";
  const mes = S.mesAtual, itens = S.mercado.itens;
  const sub = x => (+x.qtd||0) * (+x.preco||0);
  const total = itens.reduce((a,x)=>a+sub(x),0);
  const marcados = itens.filter(x=>x.ok);
  const noCarro = marcados.reduce((a,x)=>a+sub(x),0);
  const cat = S.categorias.find(c=>c.id==="mercado") || {meta:0};
  const teto = +cat.meta||0, gasto = gastoCat(mes,"mercado"), depois = gasto + total;
  const pct = teto ? depois/teto : 0, st = statusPct(pct);

  root.appendChild(el(`
    <div class="tiles">
      <div class="tile">
        <span class="k">Total da lista</span>
        <span class="v num">${BRL2.format(total)}</span>
        <span class="n">${itens.length} ite${itens.length===1?"m":"ns"}</span>
      </div>
      <div class="tile">
        <span class="k">No carrinho</span>
        <span class="v num">${BRL2.format(noCarro)}</span>
        <span class="n">${marcados.length} de ${itens.length} marcados</span>
      </div>
      <div class="tile wide-sm">
        <span class="k">Mercado depois desta compra</span>
        <span class="v num ${depois>teto?"neg":""}">${money(depois)}</span>
        <span class="n">já gastou ${money(gasto)} em ${esc(mShort(mes))} · teto ${money(teto)}
          <span class="chip-state st-${st==="good"?"good":st==="warn"?"warn":"bad"}">${Math.round(pct*100)}%</span></span>
      </div>
    </div>`));

  const card = el(`
    <div class="card">
      <div class="card-head"><h2>Lista de mercado</h2><span class="hint">marque o que já foi pro carrinho</span></div>
      <div class="row row-merc row-merc-head" aria-hidden="true">
        <span></span><span>Item</span><span>Qtd</span><span>Un</span><span>Preço un.</span><span style="text-align:right">Subtotal</span><span></span>
      </div>
      <div class="rows" id="rowsMerc"></div>
      <div class="totrow"><span>Total</span><span class="num">${BRL2.format(total)}</span></div>
      <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap">
        <button class="btn ghost sm" id="addItem">+ item</button>
        ${marcados.length ? `<button class="btn ghost sm" id="desmarcar">desmarcar todos</button>` : ""}
      </div>
    </div>`);
  const rb = card.querySelector("#rowsMerc");
  if(!itens.length) rb.appendChild(el(`<p class="empty">Lista vazia. Toque em <b>+ item</b>.</p>`));
  itens.forEach(x => {
    const row = el(`
      <div class="row row-merc${x.ok?" ok":""}">
        <input type="checkbox" ${x.ok?"checked":""} aria-label="No carrinho">
        <input class="nm plain" type="text" value="${esc(x.nome)}" placeholder="item" aria-label="Item">
        <input type="text" inputmode="decimal" class="num money" value="${fmtIn(x.qtd)}" aria-label="Quantidade">
        <input type="text" class="un" value="${esc(x.un||"")}" placeholder="un" aria-label="Unidade">
        ${inVal(x.preco, ' aria-label="Preço por unidade"')}
        <span class="num money sub">${BRL2.format(sub(x))}</span>
        <button class="btn danger" aria-label="Apagar item">×</button>
      </div>`);
    const [ok, nm, qt, un, pr] = row.querySelectorAll("input");
    ok.onchange = e => { x.ok = e.target.checked; commit(); };
    nm.onchange = e => { x.nome = e.target.value; commit(); };
    qt.onchange = e => { x.qtd = parseVal(e.target.value); commit(); };
    un.onchange = e => { x.un = e.target.value.trim(); commit(); };
    pr.onchange = e => { x.preco = parseVal(e.target.value); commit(); };
    row.querySelector("button").onclick = () => { S.mercado.itens = itens.filter(z=>z.id!==x.id); commit(); };
    rb.appendChild(row);
  });
  card.querySelector("#addItem").onclick = () => {
    itens.push({id:uid(), nome:"", qtd:1, un:"un", preco:0, ok:false}); commit();
    const ins = document.querySelectorAll("#rowsMerc input.nm");
    if(ins.length) ins[ins.length-1].focus();
  };
  const dm = card.querySelector("#desmarcar");
  if(dm) dm.onclick = () => { itens.forEach(x=>x.ok=false); commit(); };
  root.appendChild(card);
}

/* ============ render: SIMULADOR ============ */
let sim = null;
function simCopia(){ if(!sim) sim = JSON.parse(JSON.stringify(S)); return sim; }
function simMudou(){ return !!sim && JSON.stringify(sim) !== JSON.stringify(S); }

function renderSim(){
  const root = document.getElementById("tab-sim");
  root.innerHTML = "";
  const W = simCopia();
  if(W.mesAtual !== S.mesAtual) W.mesAtual = S.mesAtual;
  const mes = W.mesAtual;
  const calc = fn => withState(W, fn);

  const cabeca = el(`
    <div class="card">
      <div class="simbanner" id="simBanner" hidden>
        <span id="simBannerTxt">Cenário em teste — o app de verdade continua como estava.</span>
        <span class="acts">
          <button class="btn sm" id="simApply">Aplicar ao app</button>
          <button class="btn ghost sm" id="simReset">Descartar</button>
        </span>
      </div>
      <div class="card-head">
        <h2>Simulador de cenários</h2>
        <span class="hint">mude o que quiser — nada é gravado até você aplicar</span>
      </div>
      <div class="tiles" style="margin-bottom:18px">
        <div class="tile hero" style="box-shadow:none">
          <div class="stripe" id="simStripe"></div>
          <span class="k">Sobra em ${esc(mShort(mes))} neste cenário</span>
          <span class="v num" id="simSobra">—</span>
          <span class="n" id="simSobraN"></span>
        </div>
        <div class="tile" style="box-shadow:none">
          <span class="k">Sai por mês</span>
          <span class="v num" id="simSaiu">—</span>
          <span class="n" id="simSaiuN">fixos + parcelas + tetos</span>
        </div>
        <div class="tile" style="box-shadow:none">
          <span class="k">Contra o app atual</span>
          <span class="v num" id="simDelta">—</span>
          <span class="n" id="simDeltaN"></span>
        </div>
      </div>
      <div class="capbar" id="simBar"></div>
      <div class="caplabels" id="simLabels"></div>
    </div>`);
  root.appendChild(cabeca);

  /* dinheiro aceita virgula; contagem (parcela X de Y) continua numerica */
  const num = (val, on, extra) => (extra && extra.conta)
    ? `<input class="num money" type="number" step="1" min="${extra.min!=null?extra.min:0}" value="${val}"${extra.title?` title="${esc(extra.title)}"`:""}>`
    : inVal(val, extra&&extra.title ? ` title="${esc(extra.title)}"` : "");
  const bind = (inp, set) => {
    inp.addEventListener("input", e => { set(e.target.value); simRefresh(); });
  };

  /* ---------- renda ---------- */
  const cR = el(`
    <div class="card">
      <div class="card-head"><h2>Salário</h2><span class="hint">líquido em ${esc(mShort(mes))}: <b class="num" id="totRenda">—</b></span></div>
      <div class="rows" id="rowsRenda"></div>
      <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap">
        <button class="btn ghost sm" id="addDeg">+ degrau de salário</button>
        <button class="btn ghost sm" id="reajuste">aplicar +5% em todos</button>
      </div>
    </div>`);
  const rbR = cR.querySelector("#rowsRenda");
  W.renda.degraus.slice().sort((a,b)=>mi(a.mes)-mi(b.mes)).forEach(d => {
    const row = el(`
      <div class="row simedit" style="grid-template-columns:1fr 96px 100px 100px 34px">
        <span>
          <input class="nm plain" type="text" value="${esc(d.rotulo)}">
          <span class="snote" data-info></span>
        </span>
        <input type="month" value="${esc(d.mes)}" class="num" style="padding:6px 8px;font-size:.8rem">
        ${num(d.bruto, null, {step:50, title:"bruto"})}
        ${num(d.liquido, null, {step:50, title:"líquido"})}
        <button class="btn danger" aria-label="Apagar degrau">×</button>
      </div>`);
    const [rot, mm, br, lq] = row.querySelectorAll("input");
    rot.addEventListener("input", e => { d.rotulo = e.target.value; });
    mm.addEventListener("input",  e => { d.mes = e.target.value; simRefresh(); });
    bind(br, v => { d.bruto = parseVal(v); });
    bind(lq, v => { d.liquido = parseVal(v); });
    row.querySelector("button").onclick = () => {
      if(W.renda.degraus.length <= 1){ toast("Você precisa de pelo menos um degrau de salário.", true); return; }
      W.renda.degraus = W.renda.degraus.filter(x=>x.id!==d.id); renderSim();
    };
    rbR.appendChild(row);
  });
  cR.querySelector("#addDeg").onclick = () => {
    const ord = W.renda.degraus.slice().sort((a,b)=>mi(a.mes)-mi(b.mes));
    const last = ord[ord.length-1] || {bruto:0, liquido:0, mes:mes};
    const taxa = last.bruto ? last.liquido/last.bruto : 0.742;
    W.renda.degraus.push({ id:uid(), mes:mk(mi(last.mes)+12),
      bruto:Math.round(last.bruto*1.05), liquido:Math.round(last.bruto*1.05*taxa), rotulo:"Novo aumento" });
    renderSim();
  };
  cR.querySelector("#reajuste").onclick = () => {
    W.renda.degraus.forEach(d => {
      const taxa = d.bruto ? d.liquido/d.bruto : 0.742;
      d.bruto = Math.round(d.bruto*1.05); d.liquido = Math.round(d.bruto*taxa);
    });
    renderSim(); toast("+5% aplicado em todos os degraus do cenário.");
  };
  root.appendChild(cR);

  /* ---------- fixos ---------- */
  const cF = el(`
    <div class="card">
      <div class="card-head"><h2>Custos fixos</h2><span class="hint num" id="totFixos">—</span></div>
      <div class="rows" id="rowsFixos"></div>
      <div style="margin-top:14px"><button class="btn ghost sm" id="addFixo">+ adicionar custo fixo</button></div>
    </div>`);
  const rbF = cF.querySelector("#rowsFixos");
  if(!W.fixos.length) rbF.appendChild(el(`<p class="empty">Nenhum custo fixo neste cenário.</p>`));
  W.fixos.forEach(f => {
    const row = el(`
      <div class="row simedit" style="grid-template-columns:1fr 110px 112px 112px 34px 34px; ${calc(()=>fixoVale(f,mes))?"":"opacity:.5"}">
        <input class="nm plain" type="text" value="${esc(f.nome)}">
        ${num(f.valor)}
        <input type="month" class="num" value="${esc(f.de||"")}" title="começa em" style="padding:6px 8px;font-size:.78rem">
        <input type="month" class="num" value="${esc(f.ate||"")}" title="termina em" style="padding:6px 8px;font-size:.78rem">
        <button class="btn danger" title="${f.ativo?"Desligar neste cenário":"Religar"}">${f.ativo?"◉":"○"}</button>
        <button class="btn danger" aria-label="Apagar" data-del>×</button>
      </div>`);
    const [nm, vl, de, ate] = row.querySelectorAll("input");
    nm.addEventListener("input", e => { f.nome = e.target.value; });
    bind(vl, v => { f.valor = parseVal(v); });
    de.addEventListener("input",  e => { f.de  = e.target.value || undefined; simRefresh(); });
    ate.addEventListener("input", e => { f.ate = e.target.value || undefined; simRefresh(); });
    row.querySelectorAll("button")[0].onclick = () => { f.ativo = !f.ativo; renderSim(); };
    row.querySelector("[data-del]").onclick = () => { W.fixos = W.fixos.filter(x=>x.id!==f.id); renderSim(); };
    rbF.appendChild(row);
  });
  cF.querySelector("#addFixo").onclick = () => {
    W.fixos.push({id:uid(), nome:"", valor:0, ativo:true});
    renderSim();
    const ins = document.querySelectorAll("#rowsFixos input[type=text]");
    if(ins.length) ins[ins.length-1].focus();
  };
  root.appendChild(cF);

  /* ---------- parcelas ---------- */
  const cP = el(`
    <div class="card">
      <div class="card-head"><h2>Parcelas</h2><span class="hint num" id="totParc">—</span></div>
      <div class="rows" id="rowsParc"></div>
      <div style="margin-top:14px"><button class="btn ghost sm" id="addParc">+ adicionar parcela</button></div>
    </div>`);
  const rbP = cP.querySelector("#rowsParc");
  if(!W.parcelas.length) rbP.appendChild(el(`<p class="empty">Nenhuma parcela neste cenário — é assim que fica depois de tudo quitar.</p>`));
  W.parcelas.slice().sort((a,b)=>calc(()=>mi(parcelaFim(a))-mi(parcelaFim(b)))).forEach(p => {
    const ativa = calc(()=>parcelaAtiva(p, mes));
    const row = el(`
      <div class="row simedit" style="grid-template-columns:1fr 104px 58px 58px 96px 34px; ${ativa?"":"opacity:.45"}">
        <input class="nm plain" type="text" value="${esc(p.nome)}">
        ${num(p.valor, null, {step:1})}
        ${num(p.num,   null, {conta:1, min:1, title:"parcela atual"})}
        ${num(p.total, null, {conta:1, min:1, title:"total de parcelas"})}
        <span class="snote" style="text-align:right" data-fim></span>
        <button class="btn danger" aria-label="Apagar parcela">×</button>
      </div>`);
    const [nm, vl, nn, tt] = row.querySelectorAll("input");
    nm.addEventListener("input", e => { p.nome = e.target.value; });
    bind(vl, v => { p.valor = parseVal(v); });
    bind(nn, v => { p.num   = Math.max(1, +v||1); });
    bind(tt, v => { p.total = Math.max(1, +v||1); });
    rbP.appendChild(row);
    row.querySelector("button").onclick = () => { W.parcelas = W.parcelas.filter(x=>x.id!==p.id); renderSim(); };
  });
  cP.querySelector("#addParc").onclick = () => {
    W.parcelas.push({id:uid(), nome:"", valor:0, num:1, total:12, mesRef:mes});
    renderSim();
    const ins = document.querySelectorAll("#rowsParc input[type=text]");
    if(ins.length) ins[ins.length-1].focus();
  };
  root.appendChild(cP);

  /* ---------- tetos ---------- */
  const cT = el(`
    <div class="card">
      <div class="card-head"><h2>Tetos variáveis</h2><span class="hint num" id="totTetos">—</span></div>
      <div class="simrows" id="rowsTetos"></div>
      <div style="margin-top:14px"><button class="btn ghost sm" id="addCat">+ adicionar categoria</button></div>
    </div>`);
  const rbT = cT.querySelector("#rowsTetos");
  W.categorias.forEach(c => {
    const gasto = calc(()=>gastoCat(mes, c.id));
    const livre = c.tipo === "livre";
    const teto  = +c.meta || 0;
    const maxv  = Math.max(Math.ceil((Math.max(c.base||0, teto) * 1.6) / 100) * 100, 600);
    const kids  = calc(()=>filhosDe(c.id));
    const kidTxt = kids.map(k => `${esc(calc(()=>nomeCat(k)))} ${money(W.lancamentos.filter(l=>l.mes===mes&&l.cat===k).reduce((a,l)=>a+(+l.valor||0),0))}`).join(" · ");
    const row = el(`
      <div class="simrow ${livre?"livre":""}" data-cat="${esc(c.id)}">
        <span class="sname">
          <input class="nm plain" type="text" value="${esc(c.nome)}" style="font-weight:600; width:auto; min-width:110px">
          <button class="chip-state ${livre?"st-livre":"st-good"}" data-tipo title="Alternar entre teto e livre">${livre?"sem teto":"com teto"}</button>
          <span class="snote">${esc(c.nota||"")}${kidTxt?" · "+kidTxt+" neste mês":""}</span>
        </span>
        <span class="sctl">
          <span>${livre?"previsão":"teto"}</span>
          <input type="number" min="0" step="10" value="${teto}" aria-label="${livre?"Previsão":"Teto"} de ${esc(c.nome)}">
        </span>
        <button class="btn danger" data-del aria-label="Apagar categoria">×</button>
        <input type="range" min="0" max="${maxv}" step="10" value="${teto}" aria-label="Ajustar ${esc(c.nome)}">
        <span class="cmp">
          <span>gastou <b class="num">${money(gasto)}</b> em ${esc(mShort(mes))}${c.base?` · planilha <b class="num">${money(c.base)}</b>`:""}</span>
          <span class="num" data-delta></span>
        </span>
      </div>`);
    const nomeIn = row.querySelector('input[type=text]');
    const nIn = row.querySelector('input[type=number]'), rIn = row.querySelector('input[type=range]');
    nomeIn.addEventListener("input", e => { c.nome = e.target.value; });
    const sync = (v, from) => {
      v = Math.max(0, +v || 0);
      c.meta = v;
      if(from !== "n") nIn.value = v;
      if(from !== "r") rIn.value = Math.min(v, +rIn.max);
      simRefresh();
    };
    rIn.addEventListener("input", e => sync(e.target.value, "r"));
    nIn.addEventListener("input", e => sync(e.target.value, "n"));
    row.querySelector("[data-tipo]").onclick = () => { c.tipo = livre ? "teto" : "livre"; renderSim(); };
    row.querySelector("[data-del]").onclick = () => {
      const ks = calc(()=>filhosDe(c.id));
      const n = W.lancamentos.filter(l => l.cat===c.id || ks.indexOf(l.cat)>=0).length;
      if(!confirm(`Tirar "${c.nome||"esta categoria"}" do cenário?` + (n ? `\n\n${n} lançamento${n>1?"s":""} dela sai${n>1?"em":""} junto.` : ""))) return;
      W.categorias = W.categorias.filter(x=>x.id!==c.id);
      W.subcats    = W.subcats.filter(x=>x.pai!==c.id);
      W.lancamentos = W.lancamentos.filter(l => l.cat!==c.id && ks.indexOf(l.cat)<0);
      renderSim();
    };
    rbT.appendChild(row);
  });
  cT.querySelector("#addCat").onclick = () => {
    W.categorias.push({id:uid(), nome:"", tipo:"teto", meta:0, base:0, nota:""});
    renderSim();
    const ins = document.querySelectorAll("#rowsTetos input[type=text]");
    if(ins.length) ins[ins.length-1].focus();
  };
  root.appendChild(cT);

  /* ---------- três momentos ---------- */
  const fins = W.parcelas.map(p => calc(()=>parcelaFim(p))).sort((a,b)=>mi(a)-mi(b));
  const semParc = fins.length ? mk(mi(fins[fins.length-1])+1) : mk(mi(mes)+1);
  const cenarios = [
    {mes, rot:"Agora"},
    {mes: mk(mi(mes)+1), rot:"Mês que vem"},
    {mes: semParc, rot:"Sem parcelas"}
  ].filter((c,i,a) => a.findIndex(x=>x.mes===c.mes)===i);

  const cC = el(`
    <div class="card">
      <div class="card-head"><h2>O mesmo cenário, em três momentos</h2><span class="hint">a renda sobe e as parcelas quitam sozinhas</span></div>
      <div class="cenarios" id="simCen"></div>
      <p class="prose" style="margin-top:12px" id="simProsa"></p>
    </div>`);
  root.appendChild(cC);

  root.appendChild(el(`
    <div class="callout">
      <strong>Como funciona:</strong> tudo aqui mexe numa cópia. Enquanto você não clicar em
      <strong>Aplicar ao app</strong>, seus lançamentos, fixos e parcelas de verdade continuam intactos —
      pode apagar, inventar e exagerar à vontade. <strong>Descartar</strong> volta tudo ao que está salvo.
    </div>`));

  /* ---------- cálculo ---------- */
  function simRefresh(){
    const r = calc(() => {
      const fx = fixosTotal(mes), pc = parcelasTotal(mes), teto = metasTotal(), liq = liquidoEm(mes);
      return {fx, pc, teto, liq, saiu:fx+pc+teto, sobra:liq-fx-pc-teto, base:baseTotal()};
    });
    const real = withState(S, () => {
      const fx = fixosTotal(S.mesAtual), pc = parcelasTotal(S.mesAtual), teto = metasTotal();
      return liquidoEm(S.mesAtual) - fx - pc - teto;
    });
    const dif = r.sobra - real;

    const put = (id, txt, cls) => { const n = cabeca.querySelector(id); if(!n) return; n.textContent = txt; if(cls) n.className = cls; };
    put("#simSobra", signed(r.sobra), "v num " + (r.sobra>=0?"pos":"neg"));
    put("#simSaiu",  money(r.saiu),   "v num");
    put("#simDelta", (dif>=0?"+":"−") + money(Math.abs(dif)).replace("R$","R$"), "v num " + (dif>0?"pos":(dif<0?"neg":"")));
    cabeca.querySelector("#simStripe").style.background = r.sobra>=0 ? "var(--good)" : "var(--critical)";
    cabeca.querySelector("#simSobraN").textContent = r.sobra>=0
      ? "fecha no azul" : "faltam " + money(-r.sobra) + " para fechar o mês";
    cabeca.querySelector("#simSaiuN").textContent =
      `fixos ${money(r.fx)} · parcelas ${money(r.pc)} · tetos ${money(r.teto)}`;
    cabeca.querySelector("#simDeltaN").textContent = dif === 0
      ? "igual ao que está salvo"
      : (dif > 0 ? "sobra a mais por mês" : "sobra a menos por mês");

    const denom = Math.max(r.liq, r.saiu) || 1;
    const rest = Math.max(0, r.liq - r.saiu), over = Math.max(0, r.saiu - r.liq);
    const seg = (v,c) => v>0 ? `<span style="background:${c}; width:${(v/denom*100).toFixed(2)}%"></span>` : "";
    cabeca.querySelector("#simBar").innerHTML =
      seg(r.fx,"var(--ord-1)") + seg(r.pc,"var(--ord-2)") + seg(r.teto,"var(--ord-3)") +
      seg(rest,"var(--good)") + seg(over,"var(--critical)");
    cabeca.querySelector("#simLabels").innerHTML = [
      `<div><i style="background:var(--ord-1)"></i>Fixos <b class="num">${money(r.fx)}</b></div>`,
      r.pc ? `<div><i style="background:var(--ord-2)"></i>Parcelas <b class="num">${money(r.pc)}</b></div>` : "",
      `<div><i style="background:var(--ord-3)"></i>Tetos <b class="num">${money(r.teto)}</b></div>`,
      rest ? `<div><i style="background:var(--good)"></i>Sobra <b class="num">${money(rest)}</b></div>` : "",
      over ? `<div><i style="background:var(--critical)"></i>Estoura <b class="num">${money(over)}</b></div>` : ""
    ].join("");

    cR.querySelector("#totRenda").textContent = money(r.liq);
    cF.querySelector("#totFixos").textContent = money(r.fx) + " por mês";
    cP.querySelector("#totParc").textContent  = money(r.pc) + " em " + mShort(mes);
    cT.querySelector("#totTetos").textContent = money(r.teto) + " por mês";

    /* notas por linha */
    rbR.querySelectorAll("[data-info]").forEach((n,i) => {
      const ord = W.renda.degraus.slice().sort((a,b)=>mi(a.mes)-mi(b.mes));
      const d = ord[i], ant = i>0 ? ord[i-1] : null;
      if(!d) return;
      n.textContent = ant
        ? `${ant.bruto?((d.bruto/ant.bruto-1)*100).toFixed(1):"0"}% no bruto · ${signed(d.liquido-ant.liquido)}/mês no líquido`
        : "ponto de partida";
    });
    rbP.querySelectorAll("[data-fim]").forEach((n,i) => {
      const ps = W.parcelas.slice().sort((a,b)=>calc(()=>mi(parcelaFim(a))-mi(parcelaFim(b))));
      const p = ps[i]; if(!p) return;
      const ativa = calc(()=>parcelaAtiva(p, mes));
      n.textContent = ativa ? "até " + calc(()=>mShort(parcelaFim(p))) : "quitada";
    });
    rbT.querySelectorAll(".simrow").forEach(rw => {
      const c = W.categorias.find(x => x.id === rw.dataset.cat); if(!c) return;
      const d = (+c.base||0) - (+c.meta||0);
      const n = rw.querySelector("[data-delta]");
      n.textContent = !c.base ? "categoria nova" : (d === 0 ? "igual à planilha" : (d > 0 ? "corta " + money(d) : "sobe " + money(-d)));
      n.style.color = !c.base ? "var(--muted)" : (d > 0 ? "var(--good-ink)" : (d < 0 ? "var(--serious-ink)" : "var(--muted)"));
      const g = calc(()=>gastoCat(mes, c.id));
      rw.style.background = (c.tipo!=="livre" && g > (+c.meta||0))
        ? "color-mix(in srgb, var(--critical) 7%, transparent)" : "";
    });

    cC.querySelector("#simCen").innerHTML = cenarios.map(cn => {
      const x = calc(() => {
        const l = liquidoEm(cn.mes), pp = parcelasTotal(cn.mes), fxm = fixosTotal(cn.mes);
        return {l, pp, fxm, n:parcelasNo(cn.mes).length, sb: l - fxm - pp - r.teto};
      });
      return `<div class="cen">
        <span class="k">${esc(cn.rot)} · ${esc(mShort(cn.mes))}</span>
        <span class="v num ${x.sb>=0?"pos":"neg"}">${signed(x.sb)}</span>
        <span class="n">líquido ${money(x.l)} · ${x.n ? x.n+" parcela"+(x.n>1?"s":"")+" ("+money(x.pp)+")" : "sem parcelas"}</span>
      </div>`;
    }).join("");
    const ult = cenarios[cenarios.length-1];
    const sbU = calc(() => liquidoEm(ult.mes) - fixosTotal(ult.mes) - parcelasTotal(ult.mes) - r.teto);
    cC.querySelector("#simProsa").innerHTML =
      `Mantendo este cenário, você sai de <strong class="num">${signed(r.sobra)}</strong> em ${esc(mShort(mes))} ` +
      `para <strong class="num">${signed(sbU)}</strong> por mês em ${esc(mShort(ult.mes))}.`;

    /* banner */
    const mud = simMudou();
    cabeca.querySelector("#simBanner").hidden = !mud;
  }

  cabeca.querySelector("#simApply").onclick = () => {
    S = sim; sim = null; commit();
    toast("Cenário aplicado. Agora é o seu app de verdade.");
  };
  cabeca.querySelector("#simReset").onclick = () => {
    sim = null; renderSim();
    toast("Cenário descartado.");
  };
  simRefresh();
}

/* ============ apto novo: vender ou alugar o atual ============ */
function cardApto(){
  const A = S.aptoNovo, M = metaAtiva();
  const divida = M ? (+M.paga||0) : 0;
  const juroVo = (M && S.fixos.find(f=>f.id===M.fixoId)?.valor) || 0;
  const ref = S.investidoRef || S.mesAtual;
  const n = Math.max(1, mi(A.mes) - mi(ref));
  const salvo = S.meta; S.meta = null;          /* poupança até a compra, sem a quitação do vô no meio */
  const pj = projecao(n); S.meta = salvo;
  const poup = pj[n-1].accP;
  const P = +A.preco||0, custos = P*(+A.custos||0)/100;
  const base = Math.max(0, poup - (+A.reserva||0));
  const i = Math.pow(1 + (+A.taxa||0)/100, 1/12) - 1, N = +A.prazo||360;
  const cen = extra => {
    const caixa = base + extra, ent = Math.min(P, Math.max(0, caixa - custos)), F = P - ent;
    return {ent, F, falta: Math.max(0, F - P*0.8), sobra: Math.max(0, caixa - custos - P), parc: F>0 ? F/N + F*i : 0};
  };
  const liqVenda = (+A.venda||0) - divida;
  const V = cen(liqVenda + (+A.fgts||0)), L = cen(0);
  const parte = (+A.parte||0)/100;
  const alug = (+A.aluguel||0) * (1 - (+A.ir||0)/100);
  const bolsoV = V.parc*parte, bolsoL = L.parc*parte + juroVo - alug;
  /* no longo prazo: ficar = aluguel + valorização − juro do vô − juros do financiamento maior */
  const valoriz = (+A.venda||0) * (+A.valoriz||0)/100/12;
  const econ = alug + valoriz - juroVo - i*(L.F - V.F) - V.sobra*((+S.rendimento||0)/100);
  const pct = v => P ? Math.round(v/P*100)+"%" : "";
  const campo = (k, rot) => `<label>${rot}${inVal(A[k], ` data-ap="${k}" aria-label="${rot}"`)}</label>`;
  const falta = c => c.falta ? `<br><span class="neg" style="font-size:.75rem">faltam ${money(c.falta)} de entrada</span>` : "";

  const card = el(`
    <div class="card">
      <div class="card-head"><h2>Apto novo: vender ou alugar o atual?</h2><span class="hint">sem contar o dinheiro e o FGTS dela, que entram igual nos dois</span></div>
      <div class="apgrid">
        ${campo("preco","Preço do apto novo")}
        <label>Compra em<input type="month" class="num" data-apm value="${esc(A.mes)}" style="padding:6px 8px;font-size:.8rem" aria-label="Mês da compra"></label>
        ${campo("venda","Venda do atual (limpo)")}
        ${campo("aluguel","Aluguel do atual (limpo)")}
        ${campo("ir","IR sobre o aluguel (%)")}
        ${campo("valoriz","Valorização do atual (% ao ano)")}
        ${campo("taxa","Juros do financiamento (% ao ano)")}
        ${campo("custos","ITBI e cartório (% do preço)")}
        ${campo("fgts","Seu FGTS na compra")}
        ${campo("reserva","Reserva que você não mexe")}
        ${campo("parte","Sua parte da parcela (%)")}
      </div>
      <div style="overflow-x:auto">
      <table class="data">
        <thead><tr><th>Em ${esc(mShort(A.mes))}</th><th>Vendendo</th><th>Alugando</th></tr></thead>
        <tbody>
          <tr><td>Sua poupança, menos a reserva</td><td class="num">${money(base)}</td><td class="num">${money(base)}</td></tr>
          <tr><td>Venda do atual − ${money(divida)} do vô</td><td class="num pos">+${money(liqVenda)}</td><td class="num">—</td></tr>
          <tr><td>Seu FGTS</td><td class="num pos">+${money(+A.fgts||0)}</td><td style="color:var(--muted)">travado</td></tr>
          <tr><td>ITBI, escritura e registro</td><td class="num">−${money(custos)}</td><td class="num">−${money(custos)}</td></tr>
          <tr class="tot"><td>Entrada</td><td class="num">${money(V.ent)} · ${pct(V.ent)}</td><td class="num">${money(L.ent)} · ${pct(L.ent)}${falta(L)}</td></tr>
          <tr><td>Financiado</td><td class="num">${money(V.F)}</td><td class="num">${money(L.F)}</td></tr>
          <tr><td>Parcela inicial (SAC, ${Math.round(N/12)} anos)</td><td class="num">${money(V.parc)}</td><td class="num">${money(L.parc)}</td></tr>
          <tr><td>Sua parte (${Math.round(parte*100)}%)</td><td class="num">${money(V.parc*parte)}</td><td class="num">${money(L.parc*parte)}</td></tr>
          <tr><td>Juro do vô</td><td class="num">—</td><td class="num">${money(juroVo)}</td></tr>
          <tr><td>Entra de aluguel, já sem IR</td><td class="num">—</td><td class="num pos">+${money(alug)}</td></tr>
          <tr class="tot"><td>Sai do seu bolso por mês</td><td class="num">${money(bolsoV)}</td><td class="num">${money(bolsoL)}</td></tr>
        </tbody>
      </table>
      </div>
      <div class="callout" style="margin-top:14px">
        ${econ < 0
          ? `<strong>Vender sai melhor.</strong> Alugando, saem <span class="num">${money(bolsoL-bolsoV)}</span> a mais do seu bolso por mês e,
             mesmo contando ${(+A.valoriz||0).toLocaleString("pt-BR")}% de valorização do apto ao ano, você fica <span class="num">${money(-econ)}</span> por mês mais pobre que vendendo.`
          : `<strong>Alugar compensa.</strong> Contando ${(+A.valoriz||0).toLocaleString("pt-BR")}% de valorização ao ano, ficar com o apto deixa você
             <span class="num">${money(econ)}</span> por mês mais rico que vender — mesmo saindo <span class="num">${money(bolsoL-bolsoV)}</span> a mais do bolso.`}
        Vendendo, compre o novo em até 180 dias para não pagar IR sobre o lucro da venda.
        A Caixa financia até 80%: a parcela precisa caber em 30% da renda bruta dos dois.
      </div>
    </div>`);
  card.querySelectorAll("[data-ap]").forEach(inp => inp.onchange = e => { A[inp.dataset.ap] = parseVal(e.target.value); commit(); });
  card.querySelector("[data-apm]").onchange = e => { A.mes = e.target.value || A.mes; commit(); };
  return card;
}

/* ============ render: PLANO ============ */
function renderPlano(){

  const iP = idx(full.qP), iA = idx(full.qA);
  const N = Math.min(LIM, Math.max(14, (iP!=null ? iP : LIM-7), (iA!=null ? iA : (iP!=null ? iP : LIM-7))) + 7);

  const ano1 = proj[Math.min(13, proj.length-1)];
  const quitP = iP!=null ? full[iP] : null;
  const tempo = n => { const a=Math.floor(n/12), m=n%12; return (a?a+(a>1?" anos":" ano"):"") + (a&&m?" e ":"") + (m?m+(m>1?" meses":" mês"):""); };

  root.appendChild(el(`
    <div class="tiles">
      <div class="tile hero">
        <div class="stripe" style="background:${quitP?"var(--good)":"var(--critical)"}"></div>
        <span class="k">${M ? esc(M.nome) : "Patrimônio em "+esc(mShort(proj[proj.length-1].mes))}</span>
        <span class="v">${quitP ? esc(mLabel(full.qP)) : (M ? "fora do horizonte" : money(proj[proj.length-1].accP))}</span>
        <span class="n">${quitP ? `daqui a ${tempo(iP)}, seguindo o plano · ` : ""}sem mudar nada: <span class="num">${iA!=null ? esc(mLabel(full.qA)) : "depois de "+mShort(full[LIM-1].mes)}</span></span>
      </div>
      <div class="tile"><span class="k">Patrimônio em ${esc(mShort(ano1.mes))}</span><span class="v num">${money(ano1.accP)}</span><span class="n">começando com ${money(ini)} investidos</span></div>
      <div class="tile"><span class="k">Rendimentos até quitar</span><span class="v num pos">${money(quitP ? quitP.jurosP : proj[proj.length-1].jurosP)}</span><span class="n">${rend ? rend.toLocaleString("pt-BR")+"% ao mês sobre o saldo" : "sem rendimento — ajuste em Renda"}</span></div>

    .concat(proj.map(p => ({...p, rot:mShort(p.mes)})));
  const W=760, H=310, PL=62, PR=118, PT=30, PB=40;
  const iw = W-PL-PR, ih = H-PT-PB;
  const vals = pts.flatMap(p=>[p.accP,p.accA,p.preP||0,p.preA||0]).concat(M?[M.alvo]:[]);
  const vmax = Math.max(...vals, 0), vmin = Math.min(...vals, 0);
  const yhi = vmax*1.06 || 1000, ylo = Math.min(0, vmin*1.06);
  const y = v => PT + (yhi-v)/(yhi-ylo)*ih;
  const x = i => PL + iw*i/(pts.length-1);
  const ticks = [];
  const stepT = [1000,2000,5000,10000,20000,25000,50000,100000].find(s => (yhi-ylo)/s <= 6) || 200000;
  for(let t=Math.ceil(ylo/stepT)*stepT; t<=yhi; t+=stepT) ticks.push(t);
  const kfmt = t => t===0 ? "0" : (Math.abs(t)>=1000 ? (t/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil" : String(t));

  }).join(" ");
  const base0 = y(Math.max(0,ylo)).toFixed(1);
  const area = path("accP","preP") + ` L${x(pts.length-1).toFixed(1)},${base0} L${x(0).toFixed(1)},${base0} Z`;

  const chart = el(`

        ${M ? `<div><svg width="22" height="10" aria-hidden="true"><line x1="1" y1="5" x2="21" y2="5" stroke="var(--ink-2)" stroke-width="1"/></svg>meta de ${money(M.alvo)}</div>` : ""}

          ${M ? `<line x1="${PL}" x2="${W-PR}" y1="${y(M.alvo).toFixed(1)}" y2="${y(M.alvo).toFixed(1)}" stroke="var(--ink-2)" stroke-width="1" opacity=".55"/>
                 <text x="${W-PR+8}" y="${(y(M.alvo)+4).toFixed(1)}" font-size="10.5" fill="var(--ink-2)">meta ${kfmt(M.alvo)}</text>` : ""}
          <path d="${area}" fill="var(--s-plano)" opacity=".1"/>
          <path d="${path("accA","preA")}" fill="none" stroke="var(--s-atual)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/>

          <line id="xhair" x1="0" x2="0" y1="${PT}" y2="${PT+ih}" stroke="var(--line-strong)" stroke-width="1" opacity="0"/>
          ${qa>0 ? `<circle cx="${x(qa).toFixed(1)}" cy="${y(pts[qa].preA).toFixed(1)}" r="4.5" fill="var(--s-atual)" stroke="var(--surface)" stroke-width="2"/>` : ""}
          ${qi>0 ? `<circle cx="${x(qi).toFixed(1)}" cy="${y(pts[qi].preP).toFixed(1)}" r="5" fill="var(--s-plano)" stroke="var(--surface)" stroke-width="2"/>
            <text x="${x(qi).toFixed(1)}" y="${(y(pts[qi].preP)-12).toFixed(1)}" text-anchor="${x(qi) > W-PR-60 ? "end" : "middle"}" font-size="11" font-weight="600" fill="var(--ink)">quita o apto · ${pts[qi].rot}</text>` : ""}
          <circle cx="${x(last).toFixed(1)}" cy="${y(pts[last].accA).toFixed(1)}" r="4" fill="var(--s-atual)" stroke="var(--surface)" stroke-width="2"/>
          <circle cx="${x(last).toFixed(1)}" cy="${y(pts[last].accP).toFixed(1)}" r="4" fill="var(--s-plano)" stroke="var(--surface)" stroke-width="2"/>

  box.addEventListener("mouseleave", () => { tip.style.opacity = 0; xh.setAttribute("opacity", 0); });
  const tb = chart.querySelector("#tblBtn"), tbx = chart.querySelector("#tblBox");

        ${quitP ? `Seguindo o plano, isso acontece em <b>${esc(mLabel(full.qP))}</b>${iA!=null ? `; no ritmo de sempre, em <b>${esc(mLabel(full.qA))}</b> — ${tempo(iA-iP)} depois` : ""}.` : ""}

        <li>
          <div><div class="t">Venda o que está parado</div>
          <div class="d">Não é renda recorrente, mas é o jeito mais rápido de matar as parcelas que ainda faltam e antecipar a virada do gráfico acima em vários meses.</div></div>
          <span class="amt" style="color:var(--muted)">uma vez</span>
        </li>
        <li>
          <div><div class="t">Depois que a sobra ficar positiva, automatize</div>
          <div class="d">Transferência automática no dia do salário para uma conta separada, no valor da sobra prevista. Guardar o que sobra no fim do mês nunca funciona; sobrar o que já foi guardado, sim. Primeiro alvo: ${money(fx+parcelasTotal(mes)+metasTotal())} — um mês inteiro de despesas como reserva de emergência.</div></div>
          <span class="amt pos">reserva</span>
        </li>
      </ol>
    </div>`));

  /* --- backup --- */
  const ec = el(`
    <div class="card">
      <div class="card-head"><h2>Backup e dados</h2><span class="hint">salvo automaticamente · ${esc(haQuanto(S.atualizadoEm))}</span></div>
      <p class="prose" style="margin-bottom:14px">
        Tudo que você lança fica gravado na própria página — não precisa exportar nada para consultar depois,
        nem para eu ver seus números. O botão <strong>Salvar</strong> lá em cima força a gravação na hora,
        e o mesmo dado abre em qualquer aparelho. Os arquivos abaixo são a cópia de segurança:
        o <strong>JSON</strong> restaura o app inteiro, o <strong>CSV</strong> serve para abrir na planilha.
      </p>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center">
        <button class="btn ghost sm" id="jsonBtn">Baixar backup completo (JSON)</button>
        <button class="btn ghost sm" id="csvBtn">Baixar lançamentos (CSV)</button>
        <label class="btn ghost sm filebtn">Restaurar de um backup
          <input type="file" accept="application/json,.json" id="restoreIn">
        </label>
      </div>
    </div>`);

  const baixar = async (filename, data) => {
    let dl = null;
    try{ dl = (window.claude && claude.use) ? await claude.use("downloads") : null; }catch(e){}
    if(!dl){ toast("Download indisponível nesta visualização.", true); return; }
    try{ await dl.save({filename, data}); toast("Arquivo gerado: " + filename); }
    catch(e){ if(!(e && e.code === "cancelled")) toast("O download não foi concluído.", true); }
  };

  ec.querySelector("#csvBtn").onclick = () => {
    const rows = [["mes","dia","categoria","valor","nota"]].concat(
      S.lancamentos.map(l => [l.mes, l.dia||"", nomeCat(l.cat), String(l.valor).replace(".",","), l.nota||""])
    );
    baixar("sobra-do-mes-lancamentos.csv",
      "﻿" + rows.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(";")).join("\n"));
  };
  ec.querySelector("#jsonBtn").onclick = () =>
    baixar("sobra-do-mes-" + S.mesAtual + ".json", JSON.stringify(S, null, 2));

  ec.querySelector("#restoreIn").onchange = e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!f) return;
    const rd = new FileReader();
    rd.onerror = () => toast("Não deu para ler o arquivo.", true);
    rd.onload = () => {
      let novo = null;
      try{ novo = JSON.parse(rd.result); }
      catch(err){ toast("Arquivo inválido — não é um backup deste app.", true); return; }
      if(!novo || !Array.isArray(novo.lancamentos) || !Array.isArray(novo.categorias) || !Array.isArray(novo.fixos)){
        toast("Arquivo inválido — não é um backup deste app.", true); return;
      }
      const n = novo.lancamentos.length;
      if(!confirm("Restaurar este backup (" + n + " lançamentos)?\n\nOs dados que estão no app agora serão substituídos.")) return;
      S = migra(novo);
      tab = "painel";
      commit();
      toast("Backup restaurado: " + n + " lançamentos.");
    };
    rd.readAsText(f);
  };
  root.appendChild(ec);
}

/* ============ shell ============ */
let tab = "painel";
function render(){
  const _ml = mLabel(S.mesAtual);
  document.getElementById("mLabel").textContent = _ml.charAt(0).toUpperCase() + _ml.slice(1);
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab===tab)));
  ["painel","lancar","mercado","sim","fixos","renda","plano"].forEach(t => { document.getElementById("tab-"+t).hidden = (t!==tab); });
  if(tab!=="painel") editando = null;
  if(tab==="painel") renderPainel();
  if(tab==="lancar") renderLancar();
  if(tab==="mercado") renderMercado();
  if(tab==="sim")    renderSim();
  if(tab==="fixos")  renderFixos();
  if(tab==="renda")  renderRenda();
  if(tab==="plano")  renderPlano();
}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if(!b) return;
  tab = b.dataset.tab; render(); window.scrollTo({top:0, behavior:"instant"});
});
saveBtn.onclick = () => salvar(true);
setInterval(() => { if(!dirty && !saving) updateSaveUI(); }, 30000);
const irMes = d => { S.mesAtual = mk(mi(S.mesAtual)+d); if(sim) sim.mesAtual = S.mesAtual; commit(); };
document.getElementById("prevM").onclick = () => irMes(-1);
document.getElementById("nextM").onclick = () => irMes(1);

render();
updateSaveUI();
})();
</script>
