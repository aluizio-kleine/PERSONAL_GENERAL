<script>
(function(){
"use strict";
const PRISTINE = document.documentElement.outerHTML;

/* ============ seed ============ */
function CATS_V2(){ return [
  {id:"mercado",  nome:"Mercado",  tipo:"teto",  meta:900, base:1358, nota:"a maior fuga do mês passado"},
  {id:"gasolina", nome:"Gasolina", tipo:"teto",  meta:500, base:368,  nota:"teto já conta os fins de semana de surf"},
  {id:"lazer",    nome:"Lazer",    tipo:"teto",  meta:800, base:852,  nota:"inclui delivery, rolê, bares, extras"},
  {id:"farmacia", nome:"Farmácia", tipo:"livre", meta:150, base:481,  nota:"sem teto — só acompanha; o valor é a previsão usada na projeção"}
];}
function SUBS_V2(){ return [
  {id:"delivery", nome:"Delivery", pai:"lazer", base:243}
];}

function seed(){
  const M = "2026-08";
  const L = [];
  let n = 0;
  const add = (cat, arr) => arr.forEach(v => L.push({id:"s"+(++n), mes:M, dia:null, cat, valor:v, nota:"planilha"}));
  add("mercado",  [175,23,250,77,56,15,130,111,321,200]);
  add("gasolina", [184,184]);
  add("lazer",    [58,25,31,30,10,73,4,73,38,110,54,103]);
  add("delivery", [25,46,43,43,43,43]);
  add("farmacia", [61,420]);
  return {
    v:2, atualizadoEm:new Date().toISOString(), mesAtual:M,
    renda:{ degraus:[
      {id:"r1", mes:"2026-08", bruto:9034,  liquido:6742, rotulo:"Salário atual"},
      {id:"r2", mes:"2026-09", bruto:9485,  liquido:7068, rotulo:"Aumento de 5%"},
      {id:"r3", mes:"2026-12", bruto:10434, liquido:7757, rotulo:"Promoção +10% (alvo)"},
      {id:"r4", mes:"2027-09", bruto:10955, liquido:8134, rotulo:"Aumento seguinte de 5%"}
    ]},
    fixos:[
      {id:"f1", nome:"Aluguel",        valor:1700, ativo:true},
      {id:"f2", nome:"Carro (parcela)",valor:1000, ativo:true},
      {id:"f3", nome:"Condomínio",     valor:300,  ativo:true},
      {id:"f4", nome:"Luz",            valor:120,  ativo:true},
      {id:"f5", nome:"Internet",       valor:120,  ativo:true},
      {id:"f6", nome:"Claude",         valor:110,  ativo:true},
      {id:"f7", nome:"Assinaturas",    valor:100,  ativo:true},
      {id:"f8", nome:"Academia",       valor:100,  ativo:true},
      {id:"f9", nome:"Surfview",       valor:30,   ativo:true}
    ],
    parcelas:[
      {id:"p1", nome:"Seguro do carro", valor:283, num:2, total:10, mesRef:"2026-08"},
      {id:"p2", nome:"Fatura parcelada A", valor:225, num:2, total:2,  mesRef:"2026-08"},
      {id:"p3", nome:"Fatura parcelada B", valor:206, num:6, total:10, mesRef:"2026-08"},
      {id:"p4", nome:"Fatura parcelada C", valor:263, num:6, total:6,  mesRef:"2026-08"}
    ],
    categorias:CATS_V2(),
    subcats:SUBS_V2(),
    lancamentos:L
  };
}

/* ============ state load ============ */
const LSKEY = "sobra-do-mes/v1";
let S;
function loadState(){
  let emb=null, loc=null;
  try{ const t=document.getElementById("app-state").textContent.trim(); const p=JSON.parse(t); if(!p.seed) emb=p; }catch(e){}
  try{ const t=localStorage.getItem(LSKEY); if(t) loc=JSON.parse(t); }catch(e){}
  if(emb && loc) return migra((Date.parse(loc.atualizadoEm||0) > Date.parse(emb.atualizadoEm||0)) ? loc : emb);
  return migra(emb || loc || seed());
}
function migra(st){
  if(!st) return seed();
  if((st.v||1) < 2){
    (st.lancamentos||[]).forEach(l => { if(l.cat === "extras") l.cat = "lazer"; });
    st.categorias = CATS_V2();
    st.subcats    = SUBS_V2();
    st.v = 2;
  }
  if(!st.subcats) st.subcats = SUBS_V2();
  return st;
}
S = loadState();

/* ============ persistence ============ */
let artifactNS = null, artifactTried = false, saveTimer = null;
let dirty = false, saving = false, soLocal = false;
const flag = document.getElementById("saveflag");
const saveBtn = document.getElementById("saveBtn");

function haQuanto(iso){
  const t = Date.parse(iso || 0); if(!t) return "";
  const seg = Math.max(0, (Date.now() - t) / 1000);
  if(seg <  50) return "agora";
  if(seg < 3600) return "há " + Math.round(seg/60) + " min";
  if(seg < 86400) return "há " + Math.round(seg/3600) + "h";
  return "em " + new Date(t).toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit"});
}
function updateSaveUI(){
  if(saving){
    flag.textContent = ""; saveBtn.dataset.state = "saving";
    saveBtn.textContent = "Salvando"; saveBtn.disabled = true; return;
  }
  saveBtn.disabled = false;
  if(dirty){
    flag.textContent = "não salvo";
    saveBtn.dataset.state = "dirty"; saveBtn.textContent = "Salvar agora";
  } else if(soLocal){
    flag.textContent = "só neste aparelho · " + haQuanto(S.atualizadoEm);
    saveBtn.dataset.state = "local"; saveBtn.textContent = "Tentar de novo";
  } else {
    flag.textContent = "salvo " + haQuanto(S.atualizadoEm);
    saveBtn.dataset.state = "clean"; saveBtn.textContent = "Salvo";
  }
}
function toast(txt, bad){
  let t = document.getElementById("toast");
  if(!t){ t = el(`<div id="toast" class="toast"></div>`); document.body.appendChild(t); }
  t.textContent = txt;
  t.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(t._t); t._t = setTimeout(() => { t.className = "toast" + (bad?" bad":""); }, 3400);
}

function docWithState(st){
  const json = JSON.stringify(st).replace(/</g, "\\u003c");
  const out = PRISTINE.replace(
    /(<script type="application\/json" id="app-state">)[\s\S]*?(<\/script>)/,
    (m,a,b) => a + "\n" + json + "\n" + b
  );
  return "<!doctype html>\n" + out;
}

function persist(){
  S.atualizadoEm = new Date().toISOString();
  try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }catch(e){}
  dirty = true; updateSaveUI();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(salvar, 2500);
}
async function salvar(manual){
  clearTimeout(saveTimer);
  if(saving) return;
  if(!dirty && !manual) return;
  if(!artifactTried){
    artifactTried = true;
    try{ artifactNS = (window.claude && claude.use) ? await claude.use("artifact") : null; }catch(e){ artifactNS = null; }
  }
  if(!artifactNS){
    soLocal = true; dirty = false; updateSaveUI();
    if(manual) toast("Esta cópia não pode publicar. Os dados ficam neste navegador — baixe o backup em Plano.", true);
    return;
  }
  saving = true; updateSaveUI();
  const eraDirty = dirty;
  dirty = false;                       /* otimista: o publish recarrega a página */
  try{
    await artifactNS.publish(docWithState(S));
    saving = false; soLocal = false; updateSaveUI();
    if(manual) toast("Salvo. Seus dados vão junto com a página, em qualquer aparelho.");
  }catch(err){
    saving = false;
    if(err && err.code === "conflict"){ flag.textContent = "recarregando…"; return; }
    dirty = eraDirty; soLocal = true; updateSaveUI();
    if(manual) toast("Não deu para salvar agora. Os dados seguem neste navegador — tente de novo.", true);
  }
}
function commit(){ persist(); render(); }

/* ============ helpers ============ */
const BRL = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const BRL2 = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",minimumFractionDigits:2});
const money = v => BRL.format(Math.round(v||0));
const signed = v => (v>=0?"+":"−") + BRL.format(Math.abs(Math.round(v||0))).replace("R$","R$");
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MESES_LONG = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const mi  = m => { const [y,mm]=m.split("-").map(Number); return y*12 + (mm-1); };
const mk  = i => { const y=Math.floor(i/12), m=i%12; return y+"-"+String(m+1).padStart(2,"0"); };
const mLabel = m => { const [y,mm]=m.split("-").map(Number); return MESES_LONG[mm-1]+" de "+y; };
const mShort = m => { const [y,mm]=m.split("-").map(Number); return MESES[mm-1]+"/"+String(y).slice(2); };
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const el = (h) => { const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstElementChild; };

/* ============ model ============ */
const fixosTotal = () => S.fixos.filter(f=>f.ativo).reduce((a,f)=>a+(+f.valor||0),0);
const parcelaAtiva = (p, mes) => { const d = mi(mes)-mi(p.mesRef); return d>=0 && d <= (p.total - p.num); };
const parcelasNo   = mes => S.parcelas.filter(p=>parcelaAtiva(p,mes));
const parcelasTotal= mes => parcelasNo(mes).reduce((a,p)=>a+(+p.valor||0),0);
const parcelaFim   = p => mk(mi(p.mesRef) + (p.total - p.num));
const lancsDo      = mes => S.lancamentos.filter(l=>l.mes===mes);
const filhosDe     = id => S.subcats.filter(x=>x.pai===id).map(x=>x.id);
const gastoCat     = (mes,cat) => { const k=filhosDe(cat);
  return lancsDo(mes).filter(l=>l.cat===cat||k.indexOf(l.cat)>=0).reduce((a,l)=>a+(+l.valor||0),0); };
const variavelTotal= mes => lancsDo(mes).reduce((a,l)=>a+(+l.valor||0),0);
const metasTotal   = () => S.categorias.reduce((a,c)=>a+(+c.meta||0),0);
const baseTotal    = () => S.categorias.reduce((a,c)=>a+(+c.base||0),0);
const catsLanc     = () => S.categorias.reduce((a,c)=>a.concat([c], S.subcats.filter(x=>x.pai===c.id)), []);
const nomeCat      = id => (S.categorias.find(c=>c.id===id)||S.subcats.find(c=>c.id===id)||{nome:id}).nome;
/* roda fn com S apontando para outro estado — usado pelo simulador */
function withState(st, fn){ const old = S; S = st; try{ return fn(); } finally { S = old; } }

function liquidoEm(mes){
  const d = S.renda.degraus.slice().sort((a,b)=>mi(a.mes)-mi(b.mes));
  let v = d.length ? d[0].liquido : 0;
  for(const x of d){ if(mi(x.mes) <= mi(mes)) v = +x.liquido||0; }
  return v;
}
function brutoEm(mes){
  const d = S.renda.degraus.slice().sort((a,b)=>mi(a.mes)-mi(b.mes));
  let v = d.length ? d[0].bruto : 0;
  for(const x of d){ if(mi(x.mes) <= mi(mes)) v = +x.bruto||0; }
  return v;
}
function resumo(mes){
  const liq=liquidoEm(mes), fx=fixosTotal(), pc=parcelasTotal(mes), vr=variavelTotal(mes);
  return {liq, fx, pc, vr, saiu:fx+pc+vr, sobra:liq-(fx+pc+vr)};
}
function projecao(nMeses){
  const start = mi(S.mesAtual), meta = metasTotal(), base = baseTotal(), fx = fixosTotal();
  const out=[];
  for(let i=0;i<nMeses;i++){
    const mes = mk(start+i), liq = liquidoEm(mes), pc = parcelasTotal(mes);
    out.push({ mes, liq, pc, fx, plano: liq-fx-pc-meta, atual: liq-fx-pc-base });
  }
  return out;
}
function statusPct(p){ return p<=0.85 ? "good" : (p<=1 ? "warn" : "bad"); }
const STC = {good:"var(--good)", warn:"var(--warning)", bad:"var(--critical)"};
const STL = {good:"no ritmo", warn:"no limite", bad:"estourou"};

/* ============ render: PAINEL ============ */
let verTudo = false;
function renderPainel(){
  const mes = S.mesAtual, r = resumo(mes);
  const root = document.getElementById("tab-painel");
  root.innerHTML = "";

  const sobraCls = r.sobra >= 0 ? "pos" : "neg";
  root.appendChild(el(`
    <div class="tiles">
      <div class="tile hero">
        <div class="stripe" style="background:${r.sobra>=0?"var(--good)":"var(--critical)"}"></div>
        <span class="k">Sobra do mês</span>
        <span class="v num ${sobraCls}">${signed(r.sobra)}</span>
        <span class="n">${r.sobra>=0 ? "está sobrando dinheiro este mês" : "você está gastando mais do que ganha"}</span>
      </div>
      <div class="tile">
        <span class="k">Entrou</span>
        <span class="v num">${money(r.liq)}</span>
        <span class="n">líquido · bruto ${money(brutoEm(mes))}</span>
      </div>
      <div class="tile">
        <span class="k">Saiu</span>
        <span class="v num">${money(r.saiu)}</span>
        <span class="n">${r.liq? Math.round(r.saiu/r.liq*100):0}% do que entrou</span>
      </div>
    </div>`));

  /* structure */
  const denom = Math.max(r.liq, r.saiu) || 1;
  const seg = (v,c) => `<span style="background:${c}; width:${(v/denom*100).toFixed(2)}%"></span>`;
  const restante = Math.max(0, r.liq - r.saiu);
  const estouro  = Math.max(0, r.saiu - r.liq);
  root.appendChild(el(`
    <div class="card">
      <div class="card-head">
        <h2>Para onde vai o salário</h2>
        <span class="hint">do mais rígido ao mais flexível</span>
      </div>
      <div class="structure">
        ${seg(r.fx,"var(--ord-1)")}${seg(r.pc,"var(--ord-2)")}${seg(r.vr,"var(--ord-3)")}
        ${restante>0 ? seg(restante,"var(--surface-3)") : ""}
        ${estouro>0  ? seg(estouro,"var(--critical)") : ""}
      </div>
      <div class="legend">
        <div><i style="background:var(--ord-1)"></i>Fixos <b class="num">${money(r.fx)}</b> <span class="num">(${Math.round(r.fx/denom*100)}%)</span></div>
        <div><i style="background:var(--ord-2)"></i>Parcelas <b class="num">${money(r.pc)}</b> <span class="num">(${Math.round(r.pc/denom*100)}%)</span></div>
        <div><i style="background:var(--ord-3)"></i>Variáveis <b class="num">${money(r.vr)}</b> <span class="num">(${Math.round(r.vr/denom*100)}%)</span></div>
        ${restante>0?`<div><i style="background:var(--surface-3)"></i>Sobra <b class="num">${money(restante)}</b></div>`:""}
        ${estouro>0?`<div><i style="background:var(--critical)"></i>Estouro <b class="num">${money(estouro)}</b></div>`:""}
      </div>
    </div>`));

  /* envelopes */
  const cats = S.categorias.map(c => {
    const g = gastoCat(mes,c.id), meta = +c.meta||0;
    return {c, g, meta, livre: c.tipo==="livre", pct: meta ? g/meta : (g?2:0)};
  }).sort((a,b)=>(a.livre-b.livre) || (b.pct-a.pct));
  const gastoV = cats.reduce((a,x)=>a+x.g,0);
  const comTeto  = cats.filter(x=>!x.livre);
  const gastoT   = comTeto.reduce((a,x)=>a+x.g,0);
  const metaT    = comTeto.reduce((a,x)=>a+x.meta,0);

  const envCard = el(`
    <div class="card">
      <div class="card-head">
        <h2>Envelopes do mês</h2>
        <span class="hint num">${money(gastoT)} de ${money(metaT)} nos tetos</span>
      </div>
      <div class="meters"></div>
      <div class="totrow"><span>Com teto</span><span class="num ${gastoT>metaT?"neg":"pos"}">${money(gastoT)} / ${money(metaT)}</span></div>
      <div class="totrow" style="border-top:1px solid var(--line); font-weight:500; color:var(--ink-2)"><span>Total variável (com farmácia)</span><span class="num">${money(gastoV)}</span></div>
    </div>`);
  const mBox = envCard.querySelector(".meters");
  cats.forEach(({c,g,meta,pct,livre}) => {
    if(livre){
      mBox.appendChild(el(`
        <div class="meter">
          <span class="mname">${esc(c.nome)} <span class="chip-state st-livre">sem teto</span></span>
          <span class="mval num">${money(g)}</span>
          <span class="note"><span>${esc(c.nota||"")}</span><span class="num">previsão ${money(meta)}</span></span>
        </div>`));
      return;
    }
    const st = statusPct(pct), rest = meta-g;
    const kids = filhosDe(c.id);
    const detalhe = kids.length ? kids.map(k => {
      const kg = lancsDo(mes).filter(l=>l.cat===k).reduce((a,l)=>a+(+l.valor||0),0);
      return `${esc(nomeCat(k))} <b class="num">${money(kg)}</b>`;
    }).concat([`resto <b class="num">${money(g - kids.reduce((a,k)=>a+lancsDo(mes).filter(l=>l.cat===k).reduce((x,l)=>x+(+l.valor||0),0),0))}</b>`]).join(" · ") : "";
    mBox.appendChild(el(`
      <div class="meter">
        <span class="mname">${esc(c.nome)} <span class="chip-state st-${st==="good"?"good":st==="warn"?"warn":"bad"}">${STL[st]}</span></span>
        <span class="mval num">${money(g)} <em>/ ${money(meta)}</em></span>
        <span class="track"><span class="fill" style="width:${Math.min(100,pct*100).toFixed(1)}%; background:${STC[st]}"></span></span>
        <span class="note">
          <span>${rest>=0 ? "faltam "+money(rest)+" até o teto" : money(-rest)+" acima do teto"}</span>
          <span class="num">${Math.round(pct*100)}%</span>
        </span>
        ${detalhe ? `<span class="note" style="color:var(--muted)"><span>dentro disso: ${detalhe}</span><span></span></span>` : ""}
      </div>`));
  });
  root.appendChild(envCard);

  /* recent */
  const ls = lancsDo(mes).slice().sort((a,b)=>(b.dia||0)-(a.dia||0));
  const CAP = 8, shown = verTudo ? ls : ls.slice(0, CAP);
  const lc = el(`
    <div class="card">
      <div class="card-head"><h2>Lançamentos de ${esc(mLabel(mes))}</h2><span class="hint num">${ls.length} registro${ls.length===1?"":"s"} · ${money(variavelTotal(mes))}</span></div>
      <div class="rows"></div>
      ${ls.length > CAP ? `<div style="margin-top:14px"><button class="btn ghost sm" id="verTudo">${verTudo ? "mostrar menos" : "ver todos os "+ls.length}</button></div>` : ""}
    </div>`);
  const lb = lc.querySelector(".rows");
  if(!ls.length) lb.appendChild(el(`<p class="empty">Nada lançado ainda. Vá em <b>Lançar</b> para começar.</p>`));
  shown.forEach(l => {
    const cat = S.categorias.find(c=>c.id===l.cat);
    const row = el(`
      <div class="row row-lanc">
        <span class="datechip num">${l.dia ? String(l.dia).padStart(2,"0")+"/"+mShort(l.mes).split("/")[0] : "planilha"}</span>
        <span class="nm">${esc(cat?cat.nome:l.cat)}${l.nota && l.nota!=="planilha" ? ' <span style="color:var(--muted);font-weight:400">· '+esc(l.nota)+'</span>' : ""}</span>
        <span class="num money">${BRL2.format(l.valor)}</span>
        <button class="btn danger" aria-label="Apagar lançamento">×</button>
      </div>`);
    row.querySelector("button").onclick = () => { S.lancamentos = S.lancamentos.filter(x=>x.id!==l.id); commit(); };
    lb.appendChild(row);
  });
  const vt = lc.querySelector("#verTudo");
  if(vt) vt.onclick = () => { verTudo = !verTudo; renderPainel(); };
  root.appendChild(lc);
}

/* ============ render: LANÇAR ============ */
let draft = {cat:"mercado", valor:"", dia:null, nota:""};
function renderLancar(){
  const root = document.getElementById("tab-lancar");
  root.innerHTML = "";
  const mes = S.mesAtual;
  const today = new Date();
  const defDia = draft.dia != null ? draft.dia
    : (mk(mi(mes)) === (today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")) ? today.getDate() : 1);

  const card = el(`
    <div class="card">
      <div class="card-head"><h2>Novo gasto</h2><span class="hint">entra em ${esc(mLabel(mes))}</span></div>
      <div style="display:flex; flex-direction:column; gap:16px">
        <div class="field">
          <label for="vIn">Valor</label>
          <input id="vIn" class="amount-in num" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00" value="${esc(draft.valor)}">
          <div class="quickvals">
            ${[20,43,50,80,120,200].map(v=>`<button type="button" data-v="${v}">+${v}</button>`).join("")}
            <button type="button" data-clear="1">limpar</button>
          </div>
        </div>
        <div class="field">
          <label>Categoria</label>
          <div class="catchips">
            ${catsLanc().map(c=>`<button type="button" data-cat="${esc(c.id)}" aria-pressed="${c.id===draft.cat}">${esc(c.nome)}</button>`).join("")}
          </div>
        </div>
        <div class="grid2">
          <div class="field"><label for="dIn">Dia</label><input id="dIn" class="num" type="number" min="1" max="31" value="${defDia}"></div>
          <div class="field"><label for="nIn">Nota (opcional)</label><input id="nIn" type="text" placeholder="ex: feira, uber, remédio" value="${esc(draft.nota)}"></div>
        </div>
        <div><button class="btn" id="addBtn">Adicionar gasto</button></div>
      </div>
    </div>`);

  const vIn = card.querySelector("#vIn");
  card.querySelectorAll(".quickvals button").forEach(b => b.onclick = () => {
    if(b.dataset.clear){ vIn.value=""; }
    else vIn.value = ((+vIn.value||0) + (+b.dataset.v)).toFixed(2).replace(/\.00$/,"");
    vIn.focus();
  });
  card.querySelectorAll(".catchips button").forEach(b => b.onclick = () => {
    draft.cat = b.dataset.cat;
    card.querySelectorAll(".catchips button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.cat===draft.cat)));
  });
  const submit = () => {
    const v = +vIn.value;
    if(!v || v<=0){ vIn.focus(); return; }
    S.lancamentos.push({ id:uid(), mes, dia:+card.querySelector("#dIn").value||null, cat:draft.cat, valor:v, nota:card.querySelector("#nIn").value.trim() });
    draft = {cat:draft.cat, valor:"", dia:+card.querySelector("#dIn").value||null, nota:""};
    commit();
    setTimeout(()=>{ const f=document.querySelector("#vIn"); if(f) f.focus(); },0);
  };
  card.querySelector("#addBtn").onclick = submit;
  vIn.onkeydown = e => { if(e.key==="Enter") submit(); };
  root.appendChild(card);

  const resumoCats = el(`
    <div class="card">
      <div class="card-head"><h2>Como está o mês</h2><span class="hint">os tetos se ajustam no <b>Simulador</b></span></div>
      <div class="rows"></div>
    </div>`);
  const rb = resumoCats.querySelector(".rows");
  catsLanc().forEach(c => {
    const pai = S.subcats.find(x=>x.id===c.id);
    const g = gastoCat(mes,c.id);
    const teto = pai ? null : (c.tipo==="livre" ? null : +c.meta||0);
    rb.appendChild(el(`
      <div class="row" style="grid-template-columns:1fr auto">
        <span class="nm">${pai?"↳ ":""}${esc(c.nome)}${pai?` <span style="color:var(--muted);font-weight:400;font-size:.78rem">dentro de ${esc(nomeCat(pai.pai))}</span>`:""}</span>
        <span class="num" style="color:${teto!=null && g>teto ? "var(--critical-ink)" : "var(--ink)"}">${money(g)}${teto!=null?` <span style="color:var(--muted)">/ ${money(teto)}</span>`:` <span style="color:var(--muted)">sem teto</span>`}</span>
      </div>`));
  });
  root.appendChild(resumoCats);
}

/* ============ render: SIMULADOR ============ */
let sim = null;
function simCopia(){ if(!sim) sim = JSON.parse(JSON.stringify(S)); return sim; }
function simMudou(){ return !!sim && JSON.stringify(sim) !== JSON.stringify(S); }

function renderSim(){
  const root = document.getElementById("tab-sim");
  root.innerHTML = "";
  const W = simCopia();
  if(W.mesAtual !== S.mesAtual) W.mesAtual = S.mesAtual;
  const mes = W.mesAtual;
  const calc = fn => withState(W, fn);

  const cabeca = el(`
    <div class="card">
      <div class="simbanner" id="simBanner" hidden>
        <span id="simBannerTxt">Cenário em teste — o app de verdade continua como estava.</span>
        <span class="acts">
          <button class="btn sm" id="simApply">Aplicar ao app</button>
          <button class="btn ghost sm" id="simReset">Descartar</button>
        </span>
      </div>
      <div class="card-head">
        <h2>Simulador de cenários</h2>
        <span class="hint">mude o que quiser — nada é gravado até você aplicar</span>
      </div>
      <div class="tiles" style="margin-bottom:18px">
        <div class="tile hero" style="box-shadow:none">
          <div class="stripe" id="simStripe"></div>
          <span class="k">Sobra em ${esc(mShort(mes))} neste cenário</span>
          <span class="v num" id="simSobra">—</span>
          <span class="n" id="simSobraN"></span>
        </div>
        <div class="tile" style="box-shadow:none">
          <span class="k">Sai por mês</span>
          <span class="v num" id="simSaiu">—</span>
          <span class="n" id="simSaiuN">fixos + parcelas + tetos</span>
        </div>
        <div class="tile" style="box-shadow:none">
          <span class="k">Contra o app atual</span>
          <span class="v num" id="simDelta">—</span>
          <span class="n" id="simDeltaN"></span>
        </div>
      </div>
      <div class="capbar" id="simBar"></div>
      <div class="caplabels" id="simLabels"></div>
    </div>`);
  root.appendChild(cabeca);

  const num = (val, on, extra) =>
    `<input class="num money" type="number" step="${extra&&extra.step||10}" min="${extra&&extra.min!=null?extra.min:0}" value="${val}"${extra&&extra.title?` title="${esc(extra.title)}"`:""}>`;
  const bind = (inp, set) => {
    inp.addEventListener("input", e => { set(e.target.value); simRefresh(); });
  };

  /* ---------- renda ---------- */
  const cR = el(`
    <div class="card">
      <div class="card-head"><h2>Salário</h2><span class="hint">líquido em ${esc(mShort(mes))}: <b class="num" id="totRenda">—</b></span></div>
      <div class="rows" id="rowsRenda"></div>
      <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap">
        <button class="btn ghost sm" id="addDeg">+ degrau de salário</button>
        <button class="btn ghost sm" id="reajuste">aplicar +5% em todos</button>
      </div>
    </div>`);
  const rbR = cR.querySelector("#rowsRenda");
  W.renda.degraus.slice().sort((a,b)=>mi(a.mes)-mi(b.mes)).forEach(d => {
    const row = el(`
      <div class="row simedit" style="grid-template-columns:1fr 96px 100px 100px 34px">
        <span>
          <input class="nm plain" type="text" value="${esc(d.rotulo)}">
          <span class="snote" data-info></span>
        </span>
        <input type="month" value="${esc(d.mes)}" class="num" style="padding:6px 8px;font-size:.8rem">
        ${num(d.bruto, null, {step:50, title:"bruto"})}
        ${num(d.liquido, null, {step:50, title:"líquido"})}
        <button class="btn danger" aria-label="Apagar degrau">×</button>
      </div>`);
    const [rot, mm, br, lq] = row.querySelectorAll("input");
    rot.addEventListener("input", e => { d.rotulo = e.target.value; });
    mm.addEventListener("input",  e => { d.mes = e.target.value; simRefresh(); });
    bind(br, v => { d.bruto = +v||0; });
    bind(lq, v => { d.liquido = +v||0; });
    row.querySelector("button").onclick = () => {
      if(W.renda.degraus.length <= 1){ toast("Você precisa de pelo menos um degrau de salário.", true); return; }
      W.renda.degraus = W.renda.degraus.filter(x=>x.id!==d.id); renderSim();
    };
    rbR.appendChild(row);
  });
  cR.querySelector("#addDeg").onclick = () => {
    const ord = W.renda.degraus.slice().sort((a,b)=>mi(a.mes)-mi(b.mes));
    const last = ord[ord.length-1] || {bruto:0, liquido:0, mes:mes};
    const taxa = last.bruto ? last.liquido/last.bruto : 0.742;
    W.renda.degraus.push({ id:uid(), mes:mk(mi(last.mes)+12),
      bruto:Math.round(last.bruto*1.05), liquido:Math.round(last.bruto*1.05*taxa), rotulo:"Novo aumento" });
    renderSim();
  };
  cR.querySelector("#reajuste").onclick = () => {
    W.renda.degraus.forEach(d => {
      const taxa = d.bruto ? d.liquido/d.bruto : 0.742;
      d.bruto = Math.round(d.bruto*1.05); d.liquido = Math.round(d.bruto*taxa);
    });
    renderSim(); toast("+5% aplicado em todos os degraus do cenário.");
  };
  root.appendChild(cR);

  /* ---------- fixos ---------- */
  const cF = el(`
    <div class="card">
      <div class="card-head"><h2>Custos fixos</h2><span class="hint num" id="totFixos">—</span></div>
      <div class="rows" id="rowsFixos"></div>
      <div style="margin-top:14px"><button class="btn ghost sm" id="addFixo">+ adicionar custo fixo</button></div>
    </div>`);
  const rbF = cF.querySelector("#rowsFixos");
  if(!W.fixos.length) rbF.appendChild(el(`<p class="empty">Nenhum custo fixo neste cenário.</p>`));
  W.fixos.forEach(f => {
    const row = el(`
      <div class="row simedit" style="grid-template-columns:1fr 116px 34px 34px; ${f.ativo?"":"opacity:.45"}">
        <input class="nm plain" type="text" value="${esc(f.nome)}">
        ${num(f.valor)}
        <button class="btn danger" title="${f.ativo?"Desligar neste cenário":"Religar"}">${f.ativo?"◉":"○"}</button>
        <button class="btn danger" aria-label="Apagar" data-del>×</button>
      </div>`);
    const [nm, vl] = row.querySelectorAll("input");
    nm.addEventListener("input", e => { f.nome = e.target.value; });
    bind(vl, v => { f.valor = +v||0; });
    row.querySelectorAll("button")[0].onclick = () => { f.ativo = !f.ativo; renderSim(); };
    row.querySelector("[data-del]").onclick = () => { W.fixos = W.fixos.filter(x=>x.id!==f.id); renderSim(); };
    rbF.appendChild(row);
  });
  cF.querySelector("#addFixo").onclick = () => {
    W.fixos.push({id:uid(), nome:"", valor:0, ativo:true});
    renderSim();
    const ins = document.querySelectorAll("#rowsFixos input[type=text]");
    if(ins.length) ins[ins.length-1].focus();
  };
  root.appendChild(cF);

  /* ---------- parcelas ---------- */
  const cP = el(`
    <div class="card">
      <div class="card-head"><h2>Parcelas</h2><span class="hint num" id="totParc">—</span></div>
      <div class="rows" id="rowsParc"></div>
      <div style="margin-top:14px"><button class="btn ghost sm" id="addParc">+ adicionar parcela</button></div>
    </div>`);
  const rbP = cP.querySelector("#rowsParc");
  if(!W.parcelas.length) rbP.appendChild(el(`<p class="empty">Nenhuma parcela neste cenário — é assim que fica depois de tudo quitar.</p>`));
  W.parcelas.slice().sort((a,b)=>calc(()=>mi(parcelaFim(a))-mi(parcelaFim(b)))).forEach(p => {
    const ativa = calc(()=>parcelaAtiva(p, mes));
    const row = el(`
      <div class="row simedit" style="grid-template-columns:1fr 104px 58px 58px 96px 34px; ${ativa?"":"opacity:.45"}">
        <input class="nm plain" type="text" value="${esc(p.nome)}">
        ${num(p.valor, null, {step:1})}
        ${num(p.num,   null, {step:1, min:1, title:"parcela atual"})}
        ${num(p.total, null, {step:1, min:1, title:"total de parcelas"})}
        <span class="snote" style="text-align:right" data-fim></span>
        <button class="btn danger" aria-label="Apagar parcela">×</button>
      </div>`);
    const [nm, vl, nn, tt] = row.querySelectorAll("input");
    nm.addEventListener("input", e => { p.nome = e.target.value; });
    bind(vl, v => { p.valor = +v||0; });
    bind(nn, v => { p.num   = Math.max(1, +v||1); });
    bind(tt, v => { p.total = Math.max(1, +v||1); });
    rbP.appendChild(row);
    row.querySelector("button").onclick = () => { W.parcelas = W.parcelas.filter(x=>x.id!==p.id); renderSim(); };
  });
  cP.querySelector("#addParc").onclick = () => {
    W.parcelas.push({id:uid(), nome:"", valor:0, num:1, total:12, mesRef:mes});
    renderSim();
    const ins = document.querySelectorAll("#rowsParc input[type=text]");
    if(ins.length) ins[ins.length-1].focus();
  };
  root.appendChild(cP);

  /* ---------- tetos ---------- */
  const cT = el(`
    <div class="card">
      <div class="card-head"><h2>Tetos variáveis</h2><span class="hint num" id="totTetos">—</span></div>
      <div class="simrows" id="rowsTetos"></div>
      <div style="margin-top:14px"><button class="btn ghost sm" id="addCat">+ adicionar categoria</button></div>
    </div>`);
  const rbT = cT.querySelector("#rowsTetos");
  W.categorias.forEach(c => {
    const gasto = calc(()=>gastoCat(mes, c.id));
    const livre = c.tipo === "livre";
    const teto  = +c.meta || 0;
    const maxv  = Math.max(Math.ceil((Math.max(c.base||0, teto) * 1.6) / 100) * 100, 600);
    const kids  = calc(()=>filhosDe(c.id));
    const kidTxt = kids.map(k => `${esc(calc(()=>nomeCat(k)))} ${money(W.lancamentos.filter(l=>l.mes===mes&&l.cat===k).reduce((a,l)=>a+(+l.valor||0),0))}`).join(" · ");
    const row = el(`
      <div class="simrow ${livre?"livre":""}" data-cat="${esc(c.id)}">
        <span class="sname">
          <input class="nm plain" type="text" value="${esc(c.nome)}" style="font-weight:600; width:auto; min-width:110px">
          <button class="chip-state ${livre?"st-livre":"st-good"}" data-tipo title="Alternar entre teto e livre">${livre?"sem teto":"com teto"}</button>
          <span class="snote">${esc(c.nota||"")}${kidTxt?" · "+kidTxt+" neste mês":""}</span>
        </span>
        <span class="sctl">
          <span>${livre?"previsão":"teto"}</span>
          <input type="number" min="0" step="10" value="${teto}" aria-label="${livre?"Previsão":"Teto"} de ${esc(c.nome)}">
        </span>
        <button class="btn danger" data-del aria-label="Apagar categoria">×</button>
        <input type="range" min="0" max="${maxv}" step="10" value="${teto}" aria-label="Ajustar ${esc(c.nome)}">
        <span class="cmp">
          <span>gastou <b class="num">${money(gasto)}</b> em ${esc(mShort(mes))}${c.base?` · planilha <b class="num">${money(c.base)}</b>`:""}</span>
          <span class="num" data-delta></span>
        </span>
      </div>`);
    const nomeIn = row.querySelector('input[type=text]');
    const nIn = row.querySelector('input[type=number]'), rIn = row.querySelector('input[type=range]');
    nomeIn.addEventListener("input", e => { c.nome = e.target.value; });
    const sync = (v, from) => {
      v = Math.max(0, +v || 0);
      c.meta = v;
      if(from !== "n") nIn.value = v;
      if(from !== "r") rIn.value = Math.min(v, +rIn.max);
      simRefresh();
    };
    rIn.addEventListener("input", e => sync(e.target.value, "r"));
    nIn.addEventListener("input", e => sync(e.target.value, "n"));
    row.querySelector("[data-tipo]").onclick = () => { c.tipo = livre ? "teto" : "livre"; renderSim(); };
    row.querySelector("[data-del]").onclick = () => {
      const ks = calc(()=>filhosDe(c.id));
      const n = W.lancamentos.filter(l => l.cat===c.id || ks.indexOf(l.cat)>=0).length;
      if(!confirm(`Tirar "${c.nome||"esta categoria"}" do cenário?` + (n ? `\n\n${n} lançamento${n>1?"s":""} dela sai${n>1?"em":""} junto.` : ""))) return;
      W.categorias = W.categorias.filter(x=>x.id!==c.id);
      W.subcats    = W.subcats.filter(x=>x.pai!==c.id);
      W.lancamentos = W.lancamentos.filter(l => l.cat!==c.id && ks.indexOf(l.cat)<0);
      renderSim();
    };
    rbT.appendChild(row);
  });
  cT.querySelector("#addCat").onclick = () => {
    W.categorias.push({id:uid(), nome:"", tipo:"teto", meta:0, base:0, nota:""});
    renderSim();
    const ins = document.querySelectorAll("#rowsTetos input[type=text]");
    if(ins.length) ins[ins.length-1].focus();
  };
  root.appendChild(cT);

  /* ---------- três momentos ---------- */
  const fins = W.parcelas.map(p => calc(()=>parcelaFim(p))).sort((a,b)=>mi(a)-mi(b));
  const semParc = fins.length ? mk(mi(fins[fins.length-1])+1) : mk(mi(mes)+1);
  const cenarios = [
    {mes, rot:"Agora"},
    {mes: mk(mi(mes)+1), rot:"Mês que vem"},
    {mes: semParc, rot:"Sem parcelas"}
  ].filter((c,i,a) => a.findIndex(x=>x.mes===c.mes)===i);

  const cC = el(`
    <div class="card">
      <div class="card-head"><h2>O mesmo cenário, em três momentos</h2><span class="hint">a renda sobe e as parcelas quitam sozinhas</span></div>
      <div class="cenarios" id="simCen"></div>
      <p class="prose" style="margin-top:12px" id="simProsa"></p>
    </div>`);
  root.appendChild(cC);

  root.appendChild(el(`
    <div class="callout">
      <strong>Como funciona:</strong> tudo aqui mexe numa cópia. Enquanto você não clicar em
      <strong>Aplicar ao app</strong>, seus lançamentos, fixos e parcelas de verdade continuam intactos —
      pode apagar, inventar e exagerar à vontade. <strong>Descartar</strong> volta tudo ao que está salvo.
    </div>`));

  /* ---------- cálculo ---------- */
  function simRefresh(){
    const r = calc(() => {
      const fx = fixosTotal(), pc = parcelasTotal(mes), teto = metasTotal(), liq = liquidoEm(mes);
      return {fx, pc, teto, liq, saiu:fx+pc+teto, sobra:liq-fx-pc-teto, base:baseTotal()};
    });
    const real = withState(S, () => {
      const fx = fixosTotal(), pc = parcelasTotal(S.mesAtual), teto = metasTotal();
      return liquidoEm(S.mesAtual) - fx - pc - teto;
    });
    const dif = r.sobra - real;

    const put = (id, txt, cls) => { const n = cabeca.querySelector(id); if(!n) return; n.textContent = txt; if(cls) n.className = cls; };
    put("#simSobra", signed(r.sobra), "v num " + (r.sobra>=0?"pos":"neg"));
    put("#simSaiu",  money(r.saiu),   "v num");
    put("#simDelta", (dif>=0?"+":"−") + money(Math.abs(dif)).replace("R$","R$"), "v num " + (dif>0?"pos":(dif<0?"neg":"")));
    cabeca.querySelector("#simStripe").style.background = r.sobra>=0 ? "var(--good)" : "var(--critical)";
    cabeca.querySelector("#simSobraN").textContent = r.sobra>=0
      ? "fecha no azul" : "faltam " + money(-r.sobra) + " para fechar o mês";
    cabeca.querySelector("#simSaiuN").textContent =
      `fixos ${money(r.fx)} · parcelas ${money(r.pc)} · tetos ${money(r.teto)}`;
    cabeca.querySelector("#simDeltaN").textContent = dif === 0
      ? "igual ao que está salvo"
      : (dif > 0 ? "sobra a mais por mês" : "sobra a menos por mês");

    const denom = Math.max(r.liq, r.saiu) || 1;
    const rest = Math.max(0, r.liq - r.saiu), over = Math.max(0, r.saiu - r.liq);
    const seg = (v,c) => v>0 ? `<span style="background:${c}; width:${(v/denom*100).toFixed(2)}%"></span>` : "";
    cabeca.querySelector("#simBar").innerHTML =
      seg(r.fx,"var(--ord-1)") + seg(r.pc,"var(--ord-2)") + seg(r.teto,"var(--ord-3)") +
      seg(rest,"var(--good)") + seg(over,"var(--critical)");
    cabeca.querySelector("#simLabels").innerHTML = [
      `<div><i style="background:var(--ord-1)"></i>Fixos <b class="num">${money(r.fx)}</b></div>`,
      r.pc ? `<div><i style="background:var(--ord-2)"></i>Parcelas <b class="num">${money(r.pc)}</b></div>` : "",
      `<div><i style="background:var(--ord-3)"></i>Tetos <b class="num">${money(r.teto)}</b></div>`,
      rest ? `<div><i style="background:var(--good)"></i>Sobra <b class="num">${money(rest)}</b></div>` : "",
      over ? `<div><i style="background:var(--critical)"></i>Estoura <b class="num">${money(over)}</b></div>` : ""
    ].join("");

    cR.querySelector("#totRenda").textContent = money(r.liq);
    cF.querySelector("#totFixos").textContent = money(r.fx) + " por mês";
    cP.querySelector("#totParc").textContent  = money(r.pc) + " em " + mShort(mes);
    cT.querySelector("#totTetos").textContent = money(r.teto) + " por mês";

    /* notas por linha */
    rbR.querySelectorAll("[data-info]").forEach((n,i) => {
      const ord = W.renda.degraus.slice().sort((a,b)=>mi(a.mes)-mi(b.mes));
      const d = ord[i], ant = i>0 ? ord[i-1] : null;
      if(!d) return;
      n.textContent = ant
        ? `${ant.bruto?((d.bruto/ant.bruto-1)*100).toFixed(1):"0"}% no bruto · ${signed(d.liquido-ant.liquido)}/mês no líquido`
        : "ponto de partida";
    });
    rbP.querySelectorAll("[data-fim]").forEach((n,i) => {
      const ps = W.parcelas.slice().sort((a,b)=>calc(()=>mi(parcelaFim(a))-mi(parcelaFim(b))));
      const p = ps[i]; if(!p) return;
      const ativa = calc(()=>parcelaAtiva(p, mes));
      n.textContent = ativa ? "até " + calc(()=>mShort(parcelaFim(p))) : "quitada";
    });
    rbT.querySelectorAll(".simrow").forEach(rw => {
      const c = W.categorias.find(x => x.id === rw.dataset.cat); if(!c) return;
      const d = (+c.base||0) - (+c.meta||0);
      const n = rw.querySelector("[data-delta]");
      n.textContent = !c.base ? "categoria nova" : (d === 0 ? "igual à planilha" : (d > 0 ? "corta " + money(d) : "sobe " + money(-d)));
      n.style.color = !c.base ? "var(--muted)" : (d > 0 ? "var(--good-ink)" : (d < 0 ? "var(--serious-ink)" : "var(--muted)"));
      const g = calc(()=>gastoCat(mes, c.id));
      rw.style.background = (c.tipo!=="livre" && g > (+c.meta||0))
        ? "color-mix(in srgb, var(--critical) 7%, transparent)" : "";
    });

    cC.querySelector("#simCen").innerHTML = cenarios.map(cn => {
      const x = calc(() => {
        const l = liquidoEm(cn.mes), pp = parcelasTotal(cn.mes);
        return {l, pp, n:parcelasNo(cn.mes).length, sb: l - r.fx - pp - r.teto};
      });
      return `<div class="cen">
        <span class="k">${esc(cn.rot)} · ${esc(mShort(cn.mes))}</span>
        <span class="v num ${x.sb>=0?"pos":"neg"}">${signed(x.sb)}</span>
        <span class="n">líquido ${money(x.l)} · ${x.n ? x.n+" parcela"+(x.n>1?"s":"")+" ("+money(x.pp)+")" : "sem parcelas"}</span>
      </div>`;
    }).join("");
    const ult = cenarios[cenarios.length-1];
    const sbU = calc(() => liquidoEm(ult.mes) - r.fx - parcelasTotal(ult.mes) - r.teto);
    cC.querySelector("#simProsa").innerHTML =
      `Mantendo este cenário, você sai de <strong class="num">${signed(r.sobra)}</strong> em ${esc(mShort(mes))} ` +
      `para <strong class="num">${signed(sbU)}</strong> por mês em ${esc(mShort(ult.mes))}.`;

    /* banner */
    const mud = simMudou();
    cabeca.querySelector("#simBanner").hidden = !mud;
  }

  cabeca.querySelector("#simApply").onclick = () => {
    S = sim; sim = null; commit();
    toast("Cenário aplicado. Agora é o seu app de verdade.");
  };
  cabeca.querySelector("#simReset").onclick = () => {
    sim = null; renderSim();
    toast("Cenário descartado.");
  };
  simRefresh();
}


/* ============ render: FIXOS ============ */
function renderFixos(){
  const root = document.getElementById("tab-fixos");
  root.innerHTML = "";
  const mes = S.mesAtual;

  const fc = el(`
    <div class="card">
      <div class="card-head"><h2>Custos fixos</h2><span class="hint">todo mês, sem data para acabar</span></div>
      <div class="rows"></div>
      <div class="totrow"><span>Total fixo</span><span class="num">${money(fixosTotal())}</span></div>
      <div style="margin-top:14px"><button class="btn ghost sm" id="addFixo">+ adicionar custo fixo</button></div>
    </div>`);
  const fb = fc.querySelector(".rows");
  S.fixos.forEach(f => {
    const row = el(`
      <div class="row row-fix" style="${f.ativo?"":"opacity:.45"}">
        <input class="nm" type="text" value="${esc(f.nome)}">
        <input class="num money" type="number" min="0" step="10" value="${f.valor}">
        <button class="btn danger" title="${f.ativo?"Desativar":"Reativar"}">${f.ativo?"◉":"○"}</button>
      </div>`);
    const [nm, vl] = row.querySelectorAll("input");
    nm.onchange = e => { f.nome = e.target.value; commit(); };
    vl.onchange = e => { f.valor = +e.target.value||0; commit(); };
    row.querySelector("button").onclick = () => { f.ativo = !f.ativo; commit(); };
    fb.appendChild(row);
  });
  fc.querySelector("#addFixo").onclick = () => { S.fixos.push({id:uid(), nome:"Novo custo", valor:0, ativo:true}); commit(); };
  root.appendChild(fc);

  const ativas = parcelasNo(mes);
  const pc = el(`
    <div class="card">
      <div class="card-head"><h2>Parcelas</h2><span class="hint">${ativas.length} ativa${ativas.length===1?"":"s"} em ${esc(mShort(mes))} · ${money(parcelasTotal(mes))}</span></div>
      <div class="rows"></div>
      <div style="margin-top:14px"><button class="btn ghost sm" id="addParc">+ adicionar parcela</button></div>
    </div>`);
  const pb = pc.querySelector(".rows");
  if(!S.parcelas.length) pb.appendChild(el(`<p class="empty">Nenhuma parcela cadastrada.</p>`));
  S.parcelas.slice().sort((a,b)=>mi(parcelaFim(a))-mi(parcelaFim(b))).forEach(p => {
    const ativa = parcelaAtiva(p, mes);
    const pagoAte = p.num + (mi(mes)-mi(p.mesRef));
    const dots = Array.from({length:Math.min(p.total,14)}, (_,i) =>
      `<i class="${i+1<pagoAte?"on":(i+1===pagoAte&&ativa?"now":"")}"></i>`).join("");
    const row = el(`
      <div class="row row-parc" style="${ativa?"":"opacity:.4"}">
        <span>
          <input class="nm" type="text" value="${esc(p.nome)}" style="border:0;background:none;padding:2px 0;font-weight:600">
          <span class="dots" style="margin-top:4px">${dots}</span>
        </span>
        <input class="num money" type="number" min="0" step="1" value="${p.valor}">
        <span style="font-size:.78rem; color:var(--muted); text-align:right">
          ${ativa ? Math.min(pagoAte,p.total)+" de "+p.total : "quitada"}<br>
          <span style="color:var(--ink-2)">${ativa ? "até "+mShort(parcelaFim(p)) : "&nbsp;"}</span>
        </span>
        <button class="btn danger" aria-label="Apagar parcela">×</button>
      </div>`);
    const [nm, vl] = row.querySelectorAll("input");
    nm.onchange = e => { p.nome = e.target.value; commit(); };
    vl.onchange = e => { p.valor = +e.target.value||0; commit(); };
    row.querySelector("button.danger").onclick = () => { S.parcelas = S.parcelas.filter(x=>x.id!==p.id); commit(); };
    pb.appendChild(row);
  });
  pc.querySelector("#addParc").onclick = () => {
    S.parcelas.push({id:uid(), nome:"Nova parcela", valor:0, num:1, total:12, mesRef:S.mesAtual}); commit();
  };
  root.appendChild(pc);

  root.appendChild(el(`
    <div class="callout">
      <strong>Por que as parcelas ficam separadas dos fixos:</strong> elas têm data para acabar.
      Hoje elas somam <span class="num">${money(parcelasTotal(mes))}</span> por mês — esse dinheiro volta
      para o seu bolso conforme cada uma quita, e é isso que faz a sua sobra crescer sozinha ao longo do ano.
    </div>`));
}

/* ============ render: RENDA ============ */
function renderRenda(){
  const root = document.getElementById("tab-renda");
  root.innerHTML = "";
  const mes = S.mesAtual, bruto = brutoEm(mes), liq = liquidoEm(mes);
  const degraus = S.renda.degraus.slice().sort((a,b)=>mi(a.mes)-mi(b.mes));

  root.appendChild(el(`
    <div class="tiles">
      <div class="tile"><span class="k">Bruto hoje</span><span class="v num">${money(bruto)}</span><span class="n">${esc(mShort(mes))}</span></div>
      <div class="tile"><span class="k">Líquido hoje</span><span class="v num">${money(liq)}</span><span class="n">é isso que cai na conta</span></div>
      <div class="tile"><span class="k">Fica retido</span><span class="v num">${money(bruto-liq)}</span><span class="n">${bruto?(100-liq/bruto*100).toFixed(1):0}% de imposto e INSS</span></div>
    </div>`));

  const dc = el(`
    <div class="card">
      <div class="card-head"><h2>Degraus de salário</h2><span class="hint">cada degrau vale a partir do mês indicado</span></div>
      <div class="rows"></div>
      <div style="margin-top:14px"><button class="btn ghost sm" id="addDeg">+ adicionar degrau</button></div>
    </div>`);
  const db = dc.querySelector(".rows");
  degraus.forEach((d,i) => {
    const ant = i>0 ? degraus[i-1] : null;
    const ganho = ant ? d.liquido - ant.liquido : 0;
    const pctB  = ant && ant.bruto ? (d.bruto/ant.bruto-1)*100 : 0;
    const vigente = mi(d.mes) <= mi(mes) && (i===degraus.length-1 || mi(degraus[i+1].mes) > mi(mes));
    const row = el(`
      <div class="row simedit" style="grid-template-columns:1fr 92px 104px 104px 34px; ${vigente?"background:var(--accent-soft); border-radius:8px; padding-left:8px; padding-right:8px":""}">
        <span>
          <input class="nm" type="text" value="${esc(d.rotulo)}" style="border:0;background:none;padding:2px 0;font-weight:600">
          <span style="display:block; font-size:.76rem; color:var(--muted)">
            ${ant ? `+${pctB.toFixed(1)}% no bruto · <b style="color:var(--good-ink)">${signed(ganho)}/mês</b> no líquido` : "ponto de partida"}
            ${vigente ? ' · <b style="color:var(--accent-ink)">vigente</b>' : ''}
          </span>
        </span>
        <input type="month" value="${esc(d.mes)}" class="num" style="padding:6px 8px;font-size:.8rem">
        <input class="num money" type="number" step="1" value="${d.bruto}" title="bruto">
        <input class="num money" type="number" step="1" value="${d.liquido}" title="líquido">
        <button class="btn danger" aria-label="Apagar degrau">×</button>
      </div>`);
    const ins = row.querySelectorAll("input");
    ins[0].onchange = e => { d.rotulo = e.target.value; commit(); };
    ins[1].onchange = e => { d.mes = e.target.value; commit(); };
    ins[2].onchange = e => { d.bruto = +e.target.value||0; commit(); };
    ins[3].onchange = e => { d.liquido = +e.target.value||0; commit(); };
    row.querySelector("button.danger").onclick = () => { S.renda.degraus = S.renda.degraus.filter(x=>x.id!==d.id); commit(); };
    db.appendChild(row);
  });
  dc.querySelector("#addDeg").onclick = () => {
    const last = degraus[degraus.length-1] || {bruto:0,liquido:0,mes:S.mesAtual};
    S.renda.degraus.push({id:uid(), mes:mk(mi(last.mes)+12), bruto:Math.round(last.bruto*1.05), liquido:Math.round(last.bruto*1.05*0.742), rotulo:"Novo aumento"});
    commit();
  };
  root.appendChild(dc);

  const d0 = degraus[0], dLast = degraus[degraus.length-1];
  const cortes = baseTotal() - metasTotal();
  root.appendChild(el(`
    <div class="card">
      <div class="card-head"><h2>Quanto cada alavanca vale por mês</h2><span class="hint">no líquido, que é o que importa</span></div>
      <div class="levers">
        ${degraus.slice(1).map((d,i)=>`
          <div class="lever">
            <span class="k">${esc(d.rotulo)}</span>
            <span class="v num pos">${signed(d.liquido - degraus[i].liquido)}</span>
            <span class="n">a partir de ${esc(mShort(d.mes))}</span>
          </div>`).join("")}
        <div class="lever win">
          <span class="k">Cortar os variáveis</span>
          <span class="v num pos">${signed(cortes)}</span>
          <span class="n">vale a partir de hoje, sem depender de ninguém</span>
        </div>
      </div>
      <p class="prose" style="margin-top:14px">
        Somados, os aumentos de ${esc(d0?mShort(d0.mes):"")} até ${esc(dLast?mShort(dLast.mes):"")}
        colocam <strong class="num">${signed(dLast.liquido-d0.liquido)}</strong> por mês no seu bolso — e o último deles
        só chega daqui a ${Math.max(0, mi(dLast.mes)-mi(mes))} meses. O corte nos gastos variáveis vale
        <strong class="num">${signed(cortes)}</strong> e começa a valer no próximo mercado.
        É a alavanca mais rápida que você tem.
      </p>
    </div>`));
}

/* ============ render: PLANO ============ */
function renderPlano(){
  const root = document.getElementById("tab-plano");
  root.innerHTML = "";
  const mes = S.mesAtual, N = 14, proj = projecao(N), fx = fixosTotal();
  const acum = proj.reduce((a,p)=>a+p.plano, 0);
  const acumAtual = proj.reduce((a,p)=>a+p.atual, 0);
  const hoje = proj[0];
  const cortes = baseTotal() - metasTotal();

  root.appendChild(el(`
    <div class="tiles">
      <div class="tile hero">
        <div class="stripe" style="background:${acum>=0?"var(--good)":"var(--critical)"}"></div>
        <span class="k">Reserva em ${N} meses, seguindo o plano</span>
        <span class="v num ${acum>=0?"pos":"neg"}">${signed(acum)}</span>
        <span class="n">sem mudar nada: <span class="num">${signed(acumAtual)}</span></span>
      </div>
      <div class="tile"><span class="k">Sobra hoje</span><span class="v num ${hoje.atual>=0?"pos":"neg"}">${signed(hoje.atual)}</span><span class="n">no ritmo atual de gastos</span></div>
      <div class="tile"><span class="k">Sobra com o plano</span><span class="v num ${hoje.plano>=0?"pos":"neg"}">${signed(hoje.plano)}</span><span class="n">já neste mês</span></div>
    </div>`));

  /* --- chart --- */
  const W=760, H=290, PL=54, PR=16, PT=26, PB=42;
  const iw = W-PL-PR, ih = H-PT-PB;
  const vals = proj.flatMap(p=>[p.plano,p.atual]);
  const vmax = Math.max(...vals, 0), vmin = Math.min(...vals, 0);
  const pad = (vmax-vmin)*0.12 || 200;
  const yhi = vmax+pad, ylo = vmin-pad;
  const y = v => PT + (yhi-v)/(yhi-ylo)*ih;
  const bw = iw/proj.length, bar = Math.min(30, bw*0.5);
  const y0 = y(0);

  const ticks = [];
  const stepT = Math.max(500, Math.ceil((yhi-ylo)/5/500)*500);
  for(let t=Math.ceil(ylo/stepT)*stepT; t<=yhi; t+=stepT) ticks.push(t);

  const bars = proj.map((p,i)=>{
    const cx = PL + bw*i + bw/2;
    const yy = p.plano>=0 ? y(p.plano) : y0;
    const hh = Math.max(2, Math.abs(y(p.plano)-y0));
    const col = p.plano>=0 ? "var(--good)" : "var(--critical)";
    return `<rect class="bar" data-i="${i}" x="${(cx-bar/2).toFixed(1)}" y="${yy.toFixed(1)}" width="${bar}" height="${hh.toFixed(1)}" rx="4" fill="${col}"/>`;
  }).join("");
  const linePts = proj.map((p,i)=> (PL+bw*i+bw/2).toFixed(1)+","+y(p.atual).toFixed(1)).join(" ");
  const dots = proj.map((p,i)=>`<circle cx="${(PL+bw*i+bw/2).toFixed(1)}" cy="${y(p.atual).toFixed(1)}" r="3.2" fill="var(--surface)" stroke="var(--ink-2)" stroke-width="2"/>`).join("");

  const chart = el(`
    <div class="card">
      <div class="card-head">
        <h2>Os próximos ${N} meses</h2>
        <span class="hint">sobra mensal, em reais</span>
      </div>
      <div class="legend" style="margin:0 0 10px">
        <div><i style="background:var(--good)"></i>Com o plano <span style="color:var(--muted)">(metas + parcelas quitando + aumentos)</span></div>
        <div><i style="background:var(--ink-2); border-radius:99px; width:9px; height:9px"></i>Sem mudar nada</div>
      </div>
      <div class="chartbox">
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sobra mensal projetada para os próximos ${N} meses">
          ${ticks.map(t=>`<line x1="${PL}" x2="${W-PR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
            <text x="${PL-9}" y="${(y(t)+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${t===0?"0":(t/1000).toFixed(t%1000?1:0)+"k"}</text>`).join("")}
          <line x1="${PL}" x2="${W-PR}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="var(--axis)" stroke-width="1.5"/>
          ${bars}
          <polyline points="${linePts}" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>
          ${dots}
          ${proj.map((p,i)=>`<text x="${(PL+bw*i+bw/2).toFixed(1)}" y="${H-PB+18}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${mShort(p.mes)}</text>`).join("")}
          ${proj.map((p,i)=>`<rect class="hit" data-i="${i}" x="${(PL+bw*i).toFixed(1)}" y="${PT}" width="${bw.toFixed(1)}" height="${ih}" fill="transparent"/>`).join("")}
        </svg>
        <div class="tip" id="tip"></div>
      </div>
      <div style="margin-top:12px"><button class="btn ghost sm" id="tblBtn" aria-expanded="false">ver os números</button></div>
      <div id="tblBox" hidden>
        <table class="data">
          <thead><tr><th>Mês</th><th>Líquido</th><th>Fixos</th><th>Parcelas</th><th>Variáveis</th><th>Sobra</th><th>Sem mudar</th></tr></thead>
          <tbody>
            ${proj.map(p=>`<tr>
              <td>${mShort(p.mes)}</td><td class="num">${money(p.liq)}</td><td class="num">${money(p.fx)}</td>
              <td class="num">${money(p.pc)}</td><td class="num">${money(metasTotal())}</td>
              <td class="num ${p.plano>=0?"pos":"neg"}">${signed(p.plano)}</td>
              <td class="num ${p.atual>=0?"pos":"neg"}">${signed(p.atual)}</td></tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>`);

  const tip = chart.querySelector("#tip"), box = chart.querySelector(".chartbox");
  chart.querySelectorAll(".hit").forEach(h => {
    const show = e => {
      const p = proj[+h.dataset.i];
      tip.innerHTML = `<b>${mShort(p.mes)}</b> · líquido <b>${money(p.liq)}</b><br>
        com o plano <b>${signed(p.plano)}</b><br>sem mudar <b>${signed(p.atual)}</b>` +
        (p.pc ? `<br><span style="opacity:.7">parcelas ${money(p.pc)}</span>` : `<br><span style="opacity:.7">sem parcelas</span>`);
      const r = box.getBoundingClientRect();
      const x = (e.clientX ?? r.left+r.width/2) - r.left + box.scrollLeft;
      tip.style.opacity = 1;
      tip.style.left = Math.max(4, Math.min(x+12, box.scrollLeft + r.width - tip.offsetWidth - 8)) + "px";
      tip.style.top  = "18px";
      chart.querySelectorAll(".bar").forEach(b => b.classList.toggle("hot", b.dataset.i===h.dataset.i));
    };
    h.addEventListener("mousemove", show);
    h.addEventListener("mouseenter", show);
  });
  box.addEventListener("mouseleave", () => { tip.style.opacity = 0; chart.querySelectorAll(".bar").forEach(b=>b.classList.remove("hot")); });
  const tb = chart.querySelector("#tblBtn"), tbx = chart.querySelector("#tblBox");
  tb.onclick = () => { const o = tbx.hidden; tbx.hidden = !o; tb.setAttribute("aria-expanded", String(o)); tb.textContent = o ? "esconder os números" : "ver os números"; };
  root.appendChild(chart);

  /* --- diagnosis --- */
  const cats = S.categorias.map(c=>({...c, corte:(+c.base||0)-(+c.meta||0)}))
    .sort((a,b) => ((a.tipo==="livre")-(b.tipo==="livre")) || (b.corte-a.corte));
  const liqH = liquidoEm(mes);
  const carro = (S.fixos.find(f=>/carro/i.test(f.nome))?.valor||0)
              + (S.parcelas.find(p=>/seguro/i.test(p.nome))?.valor||0)
              + (S.categorias.find(c=>c.id==="gasolina")?.base||0);
  const moradia = (S.fixos.find(f=>/aluguel/i.test(f.nome))?.valor||0) + (S.fixos.find(f=>/condom/i.test(f.nome))?.valor||0);
  const COMIDA = (S.categorias.find(c=>c.id==="mercado")?.base||0) + (S.subcats.find(c=>c.id==="delivery")?.base||0);

  root.appendChild(el(`
    <div class="card">
      <div class="card-head"><h2>O diagnóstico</h2><span class="hint">com base no mês da planilha</span></div>
      <p class="prose" style="margin-bottom:14px">
        Você recebe <strong class="num">${money(liqH)}</strong> líquidos e gasta <strong class="num">${money(fx+parcelasTotal(mes)+baseTotal())}</strong>.
        A conta não fecha por <strong class="num neg">${money(Math.abs(hoje.atual))}</strong> todo mês — e isso vira dívida no cartão,
        que vira parcela nova, que aperta o mês seguinte. Quebrar esse ciclo é a prioridade número um.
      </p>
      <div class="levers">
        <div class="lever">
          <span class="k">Moradia</span><span class="v num">${money(moradia)}</span>
          <span class="n">${(moradia/liqH*100).toFixed(0)}% do líquido · aluguel + condomínio</span>
        </div>
        <div class="lever">
          <span class="k">Carro</span><span class="v num">${money(carro)}</span>
          <span class="n">${(carro/liqH*100).toFixed(0)}% do líquido · parcela + seguro + gasolina</span>
        </div>
        <div class="lever">
          <span class="k">Comida</span><span class="v num">${money(COMIDA)}</span>
          <span class="n">${(COMIDA/liqH*100).toFixed(0)}% do líquido · mercado + delivery</span>
        </div>
        <div class="lever">
          <span class="k">Sobra para o resto</span><span class="v num">${money(liqH-moradia-carro)}</span>
          <span class="n">depois de moradia e carro</span>
        </div>
      </div>
      <p class="prose" style="margin-top:14px">
        Moradia e carro juntos comem <strong class="num">${((moradia+carro)/liqH*100).toFixed(0)}%</strong> do que entra.
        A regra prática é ficar abaixo de 50% nos dois somados — você está acima, e é por isso que qualquer
        deslize no mercado ou na farmácia estoura o mês inteiro.
      </p>
    </div>`));

  /* --- where to cut --- */
  const cc = el(`
    <div class="card">
      <div class="card-head"><h2>Onde cortar, em ordem de impacto</h2><span class="hint num">${signed(cortes)}/mês · <a href="#" id="irSim" style="color:var(--accent-ink)">ajustar no simulador</a></span></div>
      <ol class="actions"></ol>
    </div>`);
  const cb = cc.querySelector("ol");
  const dicas = {
    mercado:"Dez compras no mês passado, várias delas pequenas. Uma lista fechada antes de sair de casa e uma ida por semana é onde este corte aparece — é a maior sozinha.",
    farmacia:"Sem teto, só acompanhando. O mês da planilha teve uma compra de R$ 420 que puxou tudo; se for remédio de uso contínuo, vale olhar genérico ou programa de desconto do laboratório.",
    lazer:"O teto de R$ 800 cobre delivery, rolê e o que antes era \u201cextras\u201d. Lançar o delivery separado continua valendo: são seis pedidos no mês, quatro deles de R$ 43, um hábito de dia fixo. É o primeiro lugar a apertar se o teto começar a estourar antes do dia 25.",
    gasolina:"Teto de R$ 500 já conta os fins de semana de surf. Neste mês você gastou R$ 368 porque não foi — não use isso como referência."
  };
  cats.forEach(c => {
    if(c.tipo === "livre"){
      cb.appendChild(el(`<li><div><div class="t">${esc(c.nome)} — sem teto</div><div class="d">${esc(dicas[c.id]||"")}</div></div><span class="amt" style="color:var(--muted)">acompanhar</span></li>`));
      return;
    }
    if(c.corte <= 0){
      cb.appendChild(el(`<li><div><div class="t">${esc(c.nome)}: teto de ${money(c.meta)}</div><div class="d">${esc(dicas[c.id]||"Está dentro do teto.")}</div></div><span class="amt" style="color:var(--muted)">${c.corte===0?"igual":"folga "+money(-c.corte)}</span></li>`));
      return;
    }
    cb.appendChild(el(`
      <li>
        <div>
          <div class="t">${esc(c.nome)}: de ${money(c.base)} para ${money(c.meta)}</div>
          <div class="d">${esc(dicas[c.id]||"")}</div>
        </div>
        <span class="amt pos">${signed(c.corte)}</span>
      </li>`));
  });
  const irSim = cc.querySelector("#irSim");
  if(irSim) irSim.onclick = e => { e.preventDefault(); tab="sim"; render(); window.scrollTo({top:0,behavior:"instant"}); };
  root.appendChild(cc);

  /* --- timeline --- */
  const marcos = [];
  const parcOrd = S.parcelas.slice().sort((a,b)=>mi(parcelaFim(a))-mi(parcelaFim(b)));
  parcOrd.forEach(p => marcos.push({mes:parcelaFim(p), tipo:"parcela", txt:`<b>${esc(p.nome)}</b> quita`, sub:`+${money(p.valor)} por mês a partir do mês seguinte`}));
  S.renda.degraus.slice(1).forEach((d,i) => marcos.push({mes:d.mes, tipo:"renda", txt:`<b>${esc(d.rotulo)}</b>`, sub:`+${money(d.liquido - S.renda.degraus[i].liquido)} por mês no líquido`}));
  marcos.sort((a,b)=>mi(a.mes)-mi(b.mes));
  root.appendChild(el(`
    <div class="card">
      <div class="card-head"><h2>Linha do tempo</h2><span class="hint">tudo que melhora sua sobra sozinho</span></div>
      <div class="steps">
        ${marcos.map(m=>`<div class="step"><span class="when">${mShort(m.mes)}</span><span class="what">${m.txt}<span class="sub">${esc(m.sub)}</span></span></div>`).join("")}
      </div>
    </div>`));

  /* --- earnings strategy --- */
  root.appendChild(el(`
    <div class="card">
      <div class="card-head"><h2>Estratégia para ganhar mais</h2><span class="hint">o outro lado da conta</span></div>
      <ol class="actions">
        <li>
          <div><div class="t">Trate a promoção como um projeto com prazo</div>
          <div class="d">Você tem até dezembro. Escreva os 3 resultados que a promoção exige, marque uma conversa com seu gestor ainda este mês para confirmar que são esses mesmos, e leve evidência a cada checkpoint. Promoção que depende de percepção costuma escorregar; promoção com critério escrito, não.</div></div>
          <span class="amt pos">+R$ 689/mês</span>
        </li>
        <li>
          <div><div class="t">Peça o aumento de 5% por escrito antes de setembro</div>
          <div class="d">Ele já está no seu planejamento, mas ainda não caiu na conta. Confirme a data efetiva — um mês de atraso custa ${money(326)}.</div></div>
          <span class="amt pos">+R$ 326/mês</span>
        </li>
        <li>
          <div><div class="t">Reserve 6h por semana para uma segunda fonte</div>
          <div class="d">Com o líquido atual, cada R$ 500/mês extra equivale a um aumento bruto de ~7%. Freelas na sua área, um projeto pequeno recorrente ou consultoria pontual chegam nesse valor mais rápido do que uma promoção — e não dependem de aprovação de ninguém.</div></div>
          <span class="amt pos">+R$ 500/mês</span>
        </li>
        <li>
          <div><div class="t">Venda o que está parado</div>
          <div class="d">Não é renda recorrente, mas é o jeito mais rápido de matar as parcelas que ainda faltam e antecipar a virada do gráfico acima em vários meses.</div></div>
          <span class="amt" style="color:var(--muted)">uma vez</span>
        </li>
        <li>
          <div><div class="t">Depois que a sobra ficar positiva, automatize</div>
          <div class="d">Transferência automática no dia do salário para uma conta separada, no valor da sobra prevista. Guardar o que sobra no fim do mês nunca funciona; sobrar o que já foi guardado, sim. Primeiro alvo: ${money(fx+parcelasTotal(mes)+metasTotal())} — um mês inteiro de despesas como reserva de emergência.</div></div>
          <span class="amt pos">reserva</span>
        </li>
      </ol>
    </div>`));

  /* --- backup --- */
  const ec = el(`
    <div class="card">
      <div class="card-head"><h2>Backup e dados</h2><span class="hint">salvo automaticamente · ${esc(haQuanto(S.atualizadoEm))}</span></div>
      <p class="prose" style="margin-bottom:14px">
        Tudo que você lança fica gravado na própria página — não precisa exportar nada para consultar depois,
        nem para eu ver seus números. O botão <strong>Salvar</strong> lá em cima força a gravação na hora,
        e o mesmo dado abre em qualquer aparelho. Os arquivos abaixo são a cópia de segurança:
        o <strong>JSON</strong> restaura o app inteiro, o <strong>CSV</strong> serve para abrir na planilha.
      </p>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center">
        <button class="btn ghost sm" id="jsonBtn">Baixar backup completo (JSON)</button>
        <button class="btn ghost sm" id="csvBtn">Baixar lançamentos (CSV)</button>
        <label class="btn ghost sm filebtn">Restaurar de um backup
          <input type="file" accept="application/json,.json" id="restoreIn">
        </label>
      </div>
    </div>`);

  const baixar = async (filename, data) => {
    let dl = null;
    try{ dl = (window.claude && claude.use) ? await claude.use("downloads") : null; }catch(e){}
    if(!dl){ toast("Download indisponível nesta visualização.", true); return; }
    try{ await dl.save({filename, data}); toast("Arquivo gerado: " + filename); }
    catch(e){ if(!(e && e.code === "cancelled")) toast("O download não foi concluído.", true); }
  };

  ec.querySelector("#csvBtn").onclick = () => {
    const rows = [["mes","dia","categoria","valor","nota"]].concat(
      S.lancamentos.map(l => [l.mes, l.dia||"", nomeCat(l.cat), String(l.valor).replace(".",","), l.nota||""])
    );
    baixar("sobra-do-mes-lancamentos.csv",
      "﻿" + rows.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(";")).join("\n"));
  };
  ec.querySelector("#jsonBtn").onclick = () =>
    baixar("sobra-do-mes-" + S.mesAtual + ".json", JSON.stringify(S, null, 2));

  ec.querySelector("#restoreIn").onchange = e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!f) return;
    const rd = new FileReader();
    rd.onerror = () => toast("Não deu para ler o arquivo.", true);
    rd.onload = () => {
      let novo = null;
      try{ novo = JSON.parse(rd.result); }
      catch(err){ toast("Arquivo inválido — não é um backup deste app.", true); return; }
      if(!novo || !Array.isArray(novo.lancamentos) || !Array.isArray(novo.categorias) || !Array.isArray(novo.fixos)){
        toast("Arquivo inválido — não é um backup deste app.", true); return;
      }
      const n = novo.lancamentos.length;
      if(!confirm("Restaurar este backup (" + n + " lançamentos)?\n\nOs dados que estão no app agora serão substituídos.")) return;
      S = migra(novo);
      tab = "painel";
      commit();
      toast("Backup restaurado: " + n + " lançamentos.");
    };
    rd.readAsText(f);
  };
  root.appendChild(ec);
}

/* ============ shell ============ */
let tab = "painel";
function render(){
  const _ml = mLabel(S.mesAtual);
  document.getElementById("mLabel").textContent = _ml.charAt(0).toUpperCase() + _ml.slice(1);
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab===tab)));
  ["painel","lancar","sim","fixos","renda","plano"].forEach(t => { document.getElementById("tab-"+t).hidden = (t!==tab); });
  if(tab==="painel") renderPainel();
  if(tab==="lancar") renderLancar();
  if(tab==="sim")    renderSim();
  if(tab==="fixos")  renderFixos();
  if(tab==="renda")  renderRenda();
  if(tab==="plano")  renderPlano();
}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if(!b) return;
  tab = b.dataset.tab; render(); window.scrollTo({top:0, behavior:"instant"});
});
saveBtn.onclick = () => salvar(true);
setInterval(() => { if(!dirty && !saving) updateSaveUI(); }, 30000);
const irMes = d => { S.mesAtual = mk(mi(S.mesAtual)+d); if(sim) sim.mesAtual = S.mesAtual; commit(); };
document.getElementById("prevM").onclick = () => irMes(-1);
document.getElementById("nextM").onclick = () => irMes(1);

render();
updateSaveUI();
})();
</script>
