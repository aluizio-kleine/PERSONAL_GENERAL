<style>

  --accent: #52B5BD; --accent-ink: #052226; --accent-soft: #173A3D;

<script>
const CATS = [
  ['marcenaria', 'Móveis planejados'], ['marmoraria', 'Mármores e bancadas'], ['iluminacao', 'Iluminação'],
  ['metais', 'Cubas, metais e banheiros'], ['cortinas', 'Cortinas'], ['moveis', 'Móveis soltos'],
  ['quarto', 'Camas e colchões'], ['eletros', 'Eletrodomésticos'], ['clima', 'Ar-condicionado'],
  ['cozinha', 'Cozinha e churrasco'], ['enxoval', 'Cama, mesa e banho'], ['casa', 'Casa e limpeza'],
  ['servicos', 'Serviços e contas'], ['outros', 'Outros']
];
const CAT_NAME = Object.fromEntries(CATS);
const STATUS = {
  pendente: 'A comprar', orcando: 'Orçado', encomendado: 'Comprado', entregue: 'Entregue', instalado: 'Instalado'

const STATUS_ORDER = Object.keys(STATUS);

/* ---------- utilidades ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

const dt = iso => new Date(iso + 'T12:00:00');

const diffDays = (a, b) => Math.round((dt(a) - dt(b)) / 86400000);

const fmtDW = iso => iso ? `${WD[dt(iso).getDay()]} ${fmtD(iso)}` : '';

}

const clone = o => JSON.parse(JSON.stringify(o));

const blobUrl = id => '/_blob/' + id;

/* ---------- regras do domínio ---------- */
const fac = it => (S.apto !== 'todos' && it.apto === 'ambos') ? 0.5 : 1;
const inApto = it => S.apto === 'todos' || it.apto === S.apto || it.apto === 'ambos';
// Item comprado sem parcelas lançadas conta como pago à vista pelo valor total.
const autoPaid = it => isClosed(it) && !(it.pagamentos || []).length && it.valor != null;
const paidOf = it => autoPaid(it) ? +it.valor : (it.pagamentos || []).filter(p => p.pago).reduce((s, p) => s + (+p.valor || 0), 0);
const plannedOf = it => (it.pagamentos || []).reduce((s, p) => s + (+p.valor || 0), 0);
const isClosed = it => STATUS_ORDER.indexOf(it.status) >= 2;
const isArrived = it => STATUS_ORDER.indexOf(it.status) >= 3;

function entriesOf(it) {
  const out = [];
  for (const ev of it.eventos || []) out.push({ kind: 'ev', it, ref: ev.id, tipo: ev.tipo || 'outro', title: ev.titulo || TIPOS[ev.tipo] || 'Data', date: ev.data || null, fim: ev.fim || null, done: !!ev.feito });
  for (const p of it.pagamentos || []) if (p.venc || !p.pago) out.push({ kind: 'pg', it, ref: p.id, tipo: 'pagamento', title: p.desc || 'Pagamento', date: p.venc || null, done: !!p.pago, valor: +p.valor || 0 });
  if (it.fecharAte) out.push({ kind: 'fechar', it, tipo: 'fechar', title: 'Fechar compra até', date: it.fecharAte, done: isClosed(it) });
  if (it.precisaAte) out.push({ kind: 'precisa', it, tipo: 'precisa', title: 'Precisa estar pronto até', date: it.precisaAte, done: isArrived(it) });
  const ped = (it.eventos || []).find(e => e.tipo === 'pedido' && e.data);
  const hasEntrega = (it.eventos || []).some(e => (e.tipo === 'entrega' || e.tipo === 'instalacao') && e.data);
  if (ped && it.prazoDias && !hasEntrega) out.push({ kind: 'calc', it, tipo: 'calc', title: `Chegada prevista (pedido + ${it.prazoDias} dias)`, date: addDays(ped.data, it.prazoDias), done: isArrived(it) });
  return out;
}
function nextEntry(it) {
  return entriesOf(it).filter(e => !e.done && e.date && e.kind !== 'pg').sort((a, b) => a.date.localeCompare(b.date))[0];
}
function filtered() {
  const q = S.q.trim().toLowerCase();

function totals(list) {
  let prev = 0, pago = 0, semValor = 0;

    pago += paidOf(it) * f;

/* ---------- armazenamento ---------- */
function lsRead() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || { items: {}, plantas: {} }; } catch (e) { return { items: {}, plantas: {} }; } }

function loadLocal() {

  S.plantas = d.plantas || {};
}
const queues = {};
function enqueue(key, fn) {

}

function writeErr(e) {

  else if (c === 'quota_exceeded') toast('O espaço da lista acabou. Exclua itens antigos e tente de novo.');
  else toast('Não foi possível salvar agora. Tente de novo em instantes.');
}
function saveItem(it) {
  const body = clone(it); delete body.id;
  body.atualizado = new Date().toISOString();
  if (myId) body.por = myId;
  const i = S.items.findIndex(x => x.id === it.id);
  if (i >= 0) S.items[i] = { ...body, id: it.id }; else S.items.push({ ...body, id: it.id });
  if (S.mode === 'local') { const d = lsRead(); d.items[it.id] = body; lsWrite(d); render(); return Promise.resolve(); }
  render();
  return enqueue('items/' + it.id, () => withRetry(() => db.collection('items').doc(it.id).set(body))).catch(writeErr);
}
function deleteItem(id) {
  S.items = S.items.filter(x => x.id !== id);
  if (S.mode === 'local') { const d = lsRead(); delete d.items[id]; lsWrite(d); render(); return Promise.resolve(); }
  render();
  return enqueue('items/' + id, () => withRetry(() => db.collection('items').doc(id).delete())).catch(writeErr);
}

/* ---------- render ---------- */
const main = document.getElementById('main');
function render() {

  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  if (S.mode === 'loading') return;
  const list = filtered();
  let html = banner();
  if (S.tab === 'itens') html += summary(list) + attention(list) + itensView(list);
  else if (S.tab === 'crono') html += cronoView(list);
  else if (S.tab === 'pag') html += pagView();
  else html += plantasView();
  html += `<div class="foot"><span>${S.items.length} itens no total</span><button type="button" class="linkbtn" data-act="backup">Backup / importar</button></div>`;
  const y = window.scrollY;
  const act = document.activeElement, actId = act && main.contains(act) ? act.id : '';
  const caret = actId === 'q' ? act.selectionStart : null;
  main.innerHTML = html;

}
function banner() {
  if (S.mode === 'local') return `<div class="banner"><b>Modo local.</b> Aberto fora do Claude, os dados ficam só neste navegador. Abra pelo link do Claude para ver a lista compartilhada.</div>`;
  if (!S.canWrite) return `<div class="banner"><b>Somente leitura.</b> Você pode ver a lista, mas não editar.</div>`;

}
function summary(list) {

function itemRow(it) {

function thumbs(arr, rmAct) {

function fmtWhen(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  const day = isoOf(d) === TODAY ? 'hoje' : fmtD(isoOf(d));
  return `${day} às ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function resolveWho() {
  whoName = '';
  if (!draft || !draft.por || !userCap || typeof userCap.profiles !== 'function') return;
  const id = draft.por;
  userCap.profiles([id]).then(ps => {
    if (!draft || draft.por !== id) return;
    const pr = ps[id];
    whoName = pr ? (pr.isMe ? 'você' : (pr.name || '')) : '';
    const el = document.getElementById('who');
    if (el && whoName) el.textContent = `Última alteração ${fmtWhen(draft.atualizado)} por ${whoName}`;
  }).catch(() => {});
}
function sumline(d) {
  const planned = plannedOf(d), paid = paidOf(d);
  if (!d.pagamentos.length) return `<span class="hint">${isClosed(d) && d.valor != null ? 'Sem parcelas: como está comprado, o valor total conta como pago.' : 'Sem parcelas: ao marcar como Comprado, o valor total passa a contar como pago.'}</span>`;
  const diff = d.valor != null ? d.valor - planned : null;
  return `<span>Pago <b class="num">${money(paid)}</b> de <span class="num">${money(planned)}</span> lançados</span>${diff != null && Math.abs(diff) > 0.5 ? `<span class="due ${diff > 0 ? 'soon' : 'late'}">${diff > 0 ? `faltam ${money(diff)} sem parcela` : `${money(-diff)} acima do valor`}</span>` : ''}`;
}
function onDraftInput(e) {
  const t = e.target;
  if (!draft || sheetMode !== 'item' || !t.dataset) return;
  if (t.dataset.upload) return;
  let v = t.type === 'checkbox' ? t.checked : t.value;
  if ('num' in t.dataset && t.type !== 'checkbox') v = parseNum(v);
  if (t.dataset.f) draft[t.dataset.f] = v;
  else if (t.dataset.l && t.dataset.k) {
    const row = draft[t.dataset.l][+t.dataset.i];
    row[t.dataset.k] = v;
    if (t.dataset.l === 'pagamentos' && t.dataset.k === 'pago') row.dataPago = v ? (row.dataPago || TODAY) : '';
  } else return;
  const sl = document.getElementById('sumline'); if (sl) sl.innerHTML = sumline(draft);
  if (t.dataset.f === 'nome') document.getElementById('sheetTitle').textContent = v || (draftIsNew ? 'Novo item' : 'Item');
}
panel.addEventListener('input', onDraftInput);
panel.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.upload) onUpload(e.target); else onDraftInput(e); });

async function onUpload(input) {
  const files = [...input.files]; input.value = '';
  if (!assets || !files.length) return;
  toast(files.length > 1 ? `Enviando ${files.length} arquivos…` : 'Enviando…');
  const done = [];
  for (const f of files) {
    try {
      const r = await assets.upload(f, f.type ? undefined : { type: /\.pdf$/i.test(f.name) ? 'application/pdf' : 'image/jpeg' });
      done.push({ id: r.id, nome: f.name, tipo: r.contentType });
    } catch (err) {
      const c = err && err.code;
      toast(c === 'too_large' ? `${f.name}: arquivo grande demais (máx. 20 MB).` : c === 'unsupported_type' ? `${f.name}: use imagem ou PDF.` : c === 'quota_or_state' ? 'Espaço de arquivos cheio.' : `Não consegui enviar ${f.name}.`);
    }
  }
  if (!done.length) return;
  if (input.dataset.upload === 'anexo' && draft) {
    draft.anexos.push(...done); newAssets.push(...done.map(x => x.id)); renderSheet();
    toast('Enviado. Toque em Salvar para guardar no item.');
  } else if (input.dataset.upload === 'planta') {
    const p = clone(S.plantas || {}); const k = 'a' + input.dataset.apto;
    p[k] = [...(p[k] || []), ...done]; await savePlantas(p); toast('Planta enviada.');
  }
}

function syncDraftFromInputs() { panel.querySelectorAll('input,select,textarea').forEach(el => { if (el.dataset.f || el.dataset.l) onDraftInput({ target: el }); }); }
async function onSave() {
  syncDraftFromInputs();
  const d = draft;
  d.nome = (d.nome || '').trim();
  if (!d.nome) { toast('Dê um nome ao item.'); panel.querySelector('[data-f="nome"]').focus(); return; }
  d.links = d.links.filter(l => (l.url || '').trim() || (l.t || '').trim()).map(l => ({ t: (l.t || '').trim(), url: /^https?:\/\//i.test((l.url || '').trim()) || !(l.url || '').trim() ? (l.url || '').trim() : 'https://' + l.url.trim() }));
  d.eventos = d.eventos.filter(e => e.titulo || e.data);
  d.pagamentos = d.pagamentos.filter(p => p.desc || p.valor != null || p.venc);
  if (!d.id) {
    let id = slug(d.nome) + (d.apto !== 'ambos' ? '-' + d.apto : ''), n = 2;
    while (S.items.some(x => x.id === id)) id = slug(d.nome) + '-' + n++;
    d.id = id;
  }
  const toDelete = removedAssets.slice();
  saveItem(d);
  closeSheet(true);
  toast('Salvo.');
  if (assets) for (const id of toDelete) assets.delete(id).catch(() => {});
}

function renderBackup() {
  const data = { exportado: new Date().toISOString(), items: S.items, plantas: S.plantas };
  panel.innerHTML = `<div class="sheet-head"><h2 id="sheetTitle">Backup e importação</h2><button type="button" class="btn small" data-act="close">Fechar</button></div>
  <div class="sheet-scroll">
    <fieldset><legend>Copiar backup</legend>
      <p class="hint" style="margin:0">Todos os itens em texto (JSON). Copie e guarde num e-mail ou nota.</p>
      <textarea class="json" id="bk-out" readonly>${esc(JSON.stringify(data, null, 1))}</textarea>
      <div><button type="button" class="btn small" data-act="copy">Copiar</button></div>
    </fieldset>
    ${S.canWrite ? `<fieldset><legend>Importar</legend>
      <p class="hint" style="margin:0">Cole um backup. Itens com o mesmo código são substituídos; os outros continuam como estão.</p>
      <textarea class="json" id="bk-in" placeholder='{"items":[…]}'></textarea>
      <div><button type="button" class="btn small ${delArmed ? 'danger armed' : ''}" data-act="import">${delArmed ? 'Confirmar importação' : 'Importar'}</button></div>
    </fieldset>` : ''}
  </div>`;
}
async function doImport() {
  let data;
  try { data = JSON.parse(document.getElementById('bk-in').value); } catch (e) { toast('O texto colado não é um backup válido.'); return; }
  const items = Array.isArray(data) ? data : data.items;
  if (!Array.isArray(items)) { toast('Não encontrei a lista de itens no backup.'); return; }
  let n = 0;
  for (const it of items) { if (it && it.id && it.nome) { await saveItem(it); n++; } }
  if (data.plantas && typeof data.plantas === 'object') await savePlantas(data.plantas);
  closeSheet(true); toast(`${n} itens importados.`);
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab],[data-apto],[data-st],[data-open]');
  if (!t) return;
  if (t.dataset.tog !== undefined) return;
  if (t.dataset.apto && t.closest('#aptoSeg')) { S.apto = t.dataset.apto; saveUi(); render(); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; saveUi(); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.st) { S.status = t.dataset.st; render(); return; }
  if (t.dataset.open && !t.dataset.act) { openItem(t.dataset.open); return; }
  const a = t.dataset.act;
  if (a === 'new') newItem();
  else if (a === 'backup') { sheetMode = 'backup'; delArmed = false; sheetFresh = true; renderSheet(); sheet.hidden = false; }
  else if (a === 'close') closeSheet(false);
  else if (a === 'reload') { const id = draft && draft.id; closeSheet(false); if (S.items.some(x => x.id === id)) openItem(id); else toast('Este item foi excluído.'); }
  else if (a === 'hidedone') { S.hideDone = !S.hideDone; saveUi(); render(); }
  else if (a === 'save') onSave();
  else if (a === 'copy') {
    const ta = document.getElementById('bk-out');
    navigator.clipboard.writeText(ta.value).then(() => toast('Backup copiado.'), () => { ta.focus(); ta.select(); toast('Texto selecionado. Copie com Ctrl+C ou segurando o dedo.'); });
  }
  else if (a === 'import') { if (!delArmed) { delArmed = true; const v = document.getElementById('bk-in').value; renderBackup(); document.getElementById('bk-in').value = v; } else doImport(); }
  else if (a === 'del') {
    if (!delArmed) { syncDraftFromInputs(); delArmed = true; renderSheet(); return; }
    const ids = (draft.anexos || []).map(x => x.id).concat(newAssets);
    deleteItem(draft.id); closeSheet(true); toast('Item excluído.');
    if (assets) for (const id of ids) assets.delete(id).catch(() => {});
  }
  else if (a === 'add') {
    syncDraftFromInputs();
    const l = t.dataset.l;
    if (l === 'links') draft.links.push({ t: '', url: '' });
    if (l === 'pagamentos') draft.pagamentos.push({ id: uid('p'), desc: '', valor: null, venc: '', pago: false, dataPago: '' });
    if (l === 'eventos') draft.eventos.push({ id: uid('e'), tipo: 'entrega', titulo: '', data: '', fim: '', feito: false });
    renderSheet();
    const rows = panel.querySelectorAll(`[data-l="${l}"][data-k]`); const last = [...rows].filter(r => r.dataset.i === String(draft[l].length - 1))[0]; last?.focus();
  }
  else if (a === 'rm') { syncDraftFromInputs(); draft[t.dataset.l].splice(+t.dataset.i, 1); renderSheet(); }
  else if (a === 'split') {
    syncDraftFromInputs();
    const half = Math.round(draft.valor * 50) / 100;
    draft.pagamentos.push({ id: uid('p'), desc: 'Entrada 50%', valor: half, venc: TODAY, pago: false, dataPago: '' }, { id: uid('p'), desc: 'Saldo 50%', valor: Math.round((draft.valor - half) * 100) / 100, venc: '', pago: false, dataPago: '' });
    renderSheet();
  }
  else if (a === 'rmanexo') {
    syncDraftFromInputs();
    const [x] = draft.anexos.splice(+t.dataset.i, 1);
    if (x) removedAssets.push(x.id);
    renderSheet();
  }
  else if (a === 'rmplanta') {
    if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Confirmar'; return; }
    const p = clone(S.plantas || {}); const k = 'a' + t.dataset.apto;
    const [x] = (p[k] || []).splice(+t.dataset.i, 1);
    savePlantas(p); if (x && assets) assets.delete(x.id).catch(() => {});
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !sheet.hidden) closeSheet(false);
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.ev .body')) { e.preventDefault(); openItem(e.target.dataset.open); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.closest('#sheet')) return;
  if (t.dataset.upload) { onUpload(t); return; }
  if (t.dataset.tog === undefined) return;
  const [kind, id, ref] = t.dataset.tog.split('|');
  const src = S.items.find(x => x.id === id); if (!src) return;
  const it = clone(src), on = t.checked;
  if (kind === 'ev') { const ev = it.eventos.find(x => x.id === ref); if (ev) ev.feito = on; }
  else if (kind === 'pg') { const p = it.pagamentos.find(x => x.id === ref); if (p) { p.pago = on; p.dataPago = on ? (p.dataPago || TODAY) : ''; } }
  else if (kind === 'fechar') it.status = on ? 'encomendado' : 'pendente';
  else if (kind === 'precisa') it.status = on ? 'entregue' : 'encomendado';
  saveItem(it);
  toast(on ? 'Marcado como feito.' : 'Desmarcado.');
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; render(); }
});

function saveUi() { try { localStorage.setItem(UI_KEY, JSON.stringify({ apto: S.apto, tab: S.tab, hideDone: S.hideDone })); } catch (e) {} }
function loadUi() {
  try { const u = JSON.parse(localStorage.getItem(UI_KEY) || '{}'); if (u.apto) S.apto = u.apto; if (u.tab) S.tab = u.tab; if (typeof u.hideDone === 'boolean') S.hideDone = u.hideDone; } catch (e) {}
  const h = (location.hash || '').slice(1);
  if (['itens', 'crono', 'pag', 'plantas'].includes(h)) S.tab = h;
}

/* ---------- inicialização ---------- */
async function boot() {
  loadUi(); render();
  if (!window.claude || typeof window.claude.use !== 'function') { S.mode = 'local'; loadLocal(); render(); return; }
  const safe = p => p.catch(() => null);
  const [d, u, a] = await Promise.all([safe(claude.use('db')), safe(claude.use('user')), safe(claude.use('assets'))]);
  if (!d) { S.mode = 'local'; loadLocal(); render(); return; }
  db = d; assets = a; userCap = u; S.mode = 'db';
  if (u) {
    try { if (typeof u.can === 'function' && (await u.can('data.write')) === false) S.canWrite = false; } catch (e) {}
    try { myId = typeof u.id === 'function' ? await u.id() : null; } catch (e) {}
  }
  db.collection('items').onSnapshot(snap => {
    S.items = snap.docs.map(doc => ({ id: doc.id, ...clone(doc.data()) }));
    render();
    checkRemote();
  }, err => { toast('Perdi a conexão com a lista. Recarregue a página.'); });
  db.doc('meta/plantas').onSnapshot(snap => { S.plantas = snap.exists ? clone(snap.data()) : {}; if (S.tab === 'plantas') render(); }, () => {});
}
// Se a outra pessoa salvar o item que está aberto aqui, avisa em vez de sobrescrever em silêncio.
function checkRemote() {
  if (sheet.hidden || !draft || draftIsNew || sheetMode !== 'item' || remoteChanged) return;
  const cur = S.items.find(x => x.id === draft.id);
  if (cur && (cur.atualizado || '') === draftBase) return;
  syncDraftFromInputs(); remoteChanged = true; renderSheet();
}
boot();
</script>
