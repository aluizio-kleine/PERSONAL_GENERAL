    <style>
      /* Visual de menu de jogo de PS2. Fonte, paleta e caixa de diálogo descritas em SPEC.md. */
      @font-face { font-family: "PS2P"; src: url("assets/fonts/press-start-2p.woff2") format("woff2"); font-display: block; }
      :root {
        --ink-dark: #000814;
        --cyan: #7fe0ff;
        --red: #ff2a1a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #b8dbf5; }
      #root { position: absolute; inset: 0; width: 1080px; height: 1920px; font-family: "PS2P", monospace; }

      .t { position: absolute; font-family: "PS2P", monospace; white-space: pre; line-height: 1.25; }
      .t .o { color: var(--ink-dark); -webkit-text-stroke: 8px var(--ink-dark); text-shadow: 4px 4px 0 rgba(0, 0, 20, 0.75); }
      .t.s64 .o, .t.s48 .o { -webkit-text-stroke: 12px var(--ink-dark); text-shadow: 6px 6px 0 rgba(0, 0, 20, 0.75); }
      .t.big .o { -webkit-text-stroke: 22px var(--ink-dark); text-shadow: 10px 10px 0 rgba(0, 0, 20, 0.75); }
      .t .f { position: absolute; left: 0; top: 0; width: 100%; text-align: inherit; }
      .s32 { font-size: 32px; } .s48 { font-size: 48px; } .s64 { font-size: 64px; } .s80 { font-size: 80px; } .s96 { font-size: 96px; } .s112 { font-size: 112px; }
      .white { color: #fff; }
      .cyan { color: var(--cyan); }
      .gold, .red, .ice { -webkit-background-clip: text; background-clip: text; color: transparent; }
      .gold { background-image: linear-gradient(180deg, #fffbd0 0%, #ffd21f 45%, #ff6a00 100%); }
      .red { background-image: linear-gradient(180deg, #ffb3a8 0%, #ff2a1a 100%); }
      .ice { background-image: linear-gradient(180deg, #ffffff 0%, #8fe3ff 100%); }

      .head { position: absolute; left: 68px; top: 220px; width: 960px; height: 170px; }
      .bar { position: absolute; left: 0; top: 148px; display: flex; gap: 12px; }
      .seg { display: block; width: 80px; height: 16px; background: rgba(255, 255, 255, 0.3); outline: 4px solid var(--ink-dark); }
      .seg.on { background: #ffc400; }

      .panel {
        position: absolute; transform-origin: 50% 50%;
        background: linear-gradient(180deg, rgba(18, 40, 120, 0.82) 0%, rgba(5, 10, 30, 0.82) 100%);
        border: 6px solid #bee6ff; border-radius: 18px;
        box-shadow: inset 0 0 0 4px rgba(5, 10, 30, 0.6), inset 0 0 0 6px rgba(255, 255, 255, 0.3);
      }
      .panel::before { content: ""; position: absolute; left: 8px; right: 8px; top: 8px; height: 42%; border-radius: 12px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0)); }
      .panel.red { background: linear-gradient(180deg, rgba(150, 24, 24, 0.9) 0%, rgba(40, 6, 6, 0.9) 100%); }

      .meter { position: absolute; left: 68px; top: 690px; width: 900px; height: 120px; }
      .vbar { position: absolute; left: 0; top: 56px; display: flex; gap: 6px; padding: 6px; background: rgba(0, 8, 20, 0.85); }
      .vseg { display: block; width: 38px; height: 36px; }
      .item { position: absolute; left: 70px; width: 860px; height: 48px; }
      .rec { position: absolute; left: 68px; top: 224px; width: 36px; height: 36px; border-radius: 50%; background: var(--red); border: 5px solid var(--ink-dark); }
    </style>
